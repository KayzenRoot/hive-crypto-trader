name: HCT-IMP-0011-S2B Candlestick Pattern Foundation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  IMPLEMENTATION_BASE_SHA: 9e6014472df7723b21f9a1d7ab2aa207ac714ccc
  CHECKPOINT_ID: HCT-CP-0035
  CHECKPOINT_STATUS: IMPLEMENTATION_AUTHORIZED_S2B
  AUTHORIZATION_ID: HCT-IMPL-AUTH-0011
  IMPLEMENTATION_ID: HCT-IMP-0011-S2B
  AUTHORIZATION_CEILING: NON_TRADING_STAGE_2_CANDLESTICK_PATTERN_FOUNDATION_ONLY

jobs:
  s2b-quality:
    name: s2b-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert exact pull request context and diff integrity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${{ github.event.pull_request.base.sha }}" = "${IMPLEMENTATION_BASE_SHA}"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "${IMPLEMENTATION_BASE_SHA}" HEAD
          git diff --check "${IMPLEMENTATION_BASE_SHA}...HEAD"
          echo "exactHead=$(git rev-parse HEAD)"
          echo "implementationBase=${IMPLEMENTATION_BASE_SHA}"

      - name: Validate CP0035 authorization and fail-closed firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(Path("checkpoints/history/HCT-CP-0035.json").read_text())
          latest = json.loads(Path("checkpoints/workstreams/planning/latest.json").read_text())
          keys = (
              "checkpoint_id", "status", "authorization_id", "authorized_increment",
              "implementation_authorized", "implementation_authorization_scope",
              "implementation_authorization_ceiling", "production_credentials_authorized",
              "production_deployment_authorized", "limited_live_authorized", "live_trading_authorized",
          )
          for key in keys:
              assert checkpoint[key] == latest[key], key
          assert checkpoint["checkpoint_id"] == "HCT-CP-0035"
          assert checkpoint["status"] == "IMPLEMENTATION_AUTHORIZED_S2B"
          assert checkpoint["authorization_id"] == "HCT-IMPL-AUTH-0011"
          assert checkpoint["authorized_increment"] == "HCT-IMP-0011-S2B"
          assert checkpoint["implementation_authorized"] is True
          assert checkpoint["implementation_authorization_scope"] == ["HCT-IMP-0011-S2B"]
          assert checkpoint["implementation_authorization_ceiling"] == "NON_TRADING_STAGE_2_CANDLESTICK_PATTERN_FOUNDATION_ONLY"
          for field in (
              "production_credentials_authorized", "production_deployment_authorized",
              "limited_live_authorized", "live_trading_authorized",
          ):
              assert checkpoint[field] is False, field
          print("CP0035 implementation scope and production/live firewall: PASS")
          PY

      - name: Validate exact changed-file boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "${IMPLEMENTATION_BASE_SHA}...HEAD" | sort)
          allowed='^(\.github/workflows/s2b-quality\.yml|apps/backend/src/hct_backend/(patterns|pattern_engine)\.py|apps/backend/tests/test_patterns\.py|scripts/(scan_s2b_boundaries|benchmark_s2b)\.py|evidence/HCT-IMP-0011-S2B(-CONTEXT-LOCK)?\.md)$'
          invalid=()
          for path in "${changed[@]}"; do
            if ! [[ "${path}" =~ ${allowed} ]]; then invalid+=("${path}"); fi
          done
          if [ "${#invalid[@]}" -ne 0 ]; then
            printf '%s\n' "${invalid[@]}"
            exit 1
          fi
          if printf '%s\n' "${changed[@]}" | grep -Eq '^(docs/|checkpoints/|work-orders/|adr/|apps/frontend/|apps/backend/src/hct_backend/(features|feature_engine|market_truth|s1f_)[a-z_]*\.py|packages/contracts/|apps/backend/pyproject.toml|apps/backend/uv.lock)'; then
            echo "Frozen governance, dependency, contract, upstream or frontend surface changed."
            exit 1
          fi
          echo "S2B changed-file boundary: PASS"

      - name: Validate frozen source identities and CP0035 handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          expected = {
              "docs/06-test-benchmark-plan.md": "29401ce8fe1616f9390a317bae62d3a157addaa5",
              "docs/09-definition-of-done.md": "53741dab7a3e3ebfaf1a61ef89b638cb97e17cb1",
              "docs/14-product-module-map.md": "f2e254e493ed27a31c4986f006e6455bc1b58c3e",
              "docs/92-r11-v1-module-classification-and-integration-hardening.md": "aea9d476a6cf14f0e9e58872a48094aeda2f154f",
              "docs/99-r12-frozen-requirements-baseline.md": "cdaf66eab10f650292908679efbb7d0ec400ebf9",
              "docs/100-r12-requirements-traceability-and-no-loss-proof.md": "2ef416b4ea06e2aaee8b3545e1022f3459f3d647",
              "docs/101-r12-freeze-governance-change-control-and-deferred-decisions.md": "5ec4003c577fc4875c5cad494e8877f731d3f943",
              "checkpoints/history/HCT-CP-0014.json": "99c94f226b7beb454c946fb6eb0fc9628a54531f",
              "work-orders/HCT-IMP-0011-S2B.md": "205bbc21051f670c9a92bbacfb67a512bb544496",
              "apps/backend/src/hct_backend/features.py": "40dba614d6a146c42fc7c4755416bcedd55a7f1c",
              "apps/backend/src/hct_backend/feature_engine.py": "a46bca1b82ce0d9b168af5cf7b34a06ee2ef5f38",
              "apps/backend/src/hct_backend/market_truth.py": "01cdb87eff460f1d6761625bf6a722a3a4432bf5",
              "apps/backend/src/hct_backend/s1f_values.py": "38620bc4ea4f1fc5b14cd525c7a9ca0251d9cbfd",
              "apps/backend/src/hct_backend/s1f_numeric.py": "76c74b1d746f74dfa0e0aac54a286584ab545cb8",
          }
          base = os.environ["IMPLEMENTATION_BASE_SHA"]
          for path, digest in expected.items():
              actual = subprocess.check_output(["git", "rev-parse", f"{base}:{path}"], text=True).strip()
              assert actual == digest, (path, actual, digest)
          for path in ("evidence/HCT-IMP-0011-S2B-CONTEXT-LOCK.md", "evidence/HCT-IMP-0011-S2B.md"):
              assert subprocess.check_output(["git", "rev-parse", f"HEAD:{path}"], text=True).strip()
          print("Frozen source identities and CP0035 handoff: PASS")
          PY

      - name: Validate implementation contract, pair seam and negative scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("apps/backend/src/hct_backend/patterns.py").read_text()
          engine = Path("apps/backend/src/hct_backend/pattern_engine.py").read_text()
          lock = Path("evidence/HCT-IMP-0011-S2B-CONTEXT-LOCK.md").read_text()
          import ast

          required = (
              "P-DC-001", "P-MB-001", "P-EC-001", "P-EC-002", "P-MS-001", "P-ES-001",
              "S2B_STANDARD_CANDLESTICK_PATTERNS_V1", "FEATURE_DECIMAL_V1",
              "S2B_SHA256_CANONICAL_JSON_V1", "PatternValidity", "PatternMatchState",
              "PatternDirection", "PatternConstituent", "PatternEvidence",
              "sample.fingerprint", "CandleBar", "FeatureSample", "FeatureAuthorityEvidence",
              "UNIX_EPOCH_MULTIPLES", "SMALL_BODY_MAX", "LONG_BODY_MIN",
              "OVER_CARDINALITY_WINDOW", "EXACT_CARDINALITY_OVER_CARDINALITY_WINDOW_INVALID",
              "PatternEvaluationState", "constituent_revisions", "_evidence_seal",
              "CANDLEBAR_OHLC_PLUS_EVALUATOR_ISSUED_FEATURE_SAMPLE",
              "S2B_CANONICAL_EVALUATION_BOUNDARY=max(window_end,knowledge_time)",
              "ZERO_RANGE_PRIMITIVE_UNKNOWN", "CLOSED_BAR_REQUIRED",
              "DOJI:r[0]<=SMALL_BODY_MAX", "LONG_BODY:r[0]>=LONG_BODY_MIN",
              "BULLISH_ENGULFING:close[0]<open[0]", "BEARISH_ENGULFING:close[0]>open[0]",
              "MORNING_STAR:close[0]<open[0]", "EVENING_STAR:close[0]>open[0]",
          )
          for marker in required:
              assert marker in source, marker
          assert "_from_evaluator" not in source
          raw_inputs = {
              "revision", "revisions",
              "predecessor_evidence_fingerprint", "predecessor_evidence_fingerprints",
          }
          for node in ast.walk(ast.parse(source)):
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              if node.name in {"_from_evaluator", "_from_material", "_mint", "_attach_attestation"}:
                  raise AssertionError(f"arbitrary evidence issuance helper {node.name}")
              names = {
                  item.arg
                  for item in (*node.args.posonlyargs, *node.args.args, *node.args.kwonlyargs)
              }
              if node.name in {"evaluate_pattern", "evaluate_patterns"} and names & raw_inputs:
                  raise AssertionError(f"raw evaluator input in {node.name}: {sorted(names & raw_inputs)}")
          for marker in ("patterns", "PatternEvidence"):
              assert marker in engine, marker
          for marker in (
              "S2B_CONSTITUENT_PAIR", "S2B_CANONICAL_EVALUATION_BOUNDARY",
              "S2B_VALIDITY_FOLD_PRECEDENCE", "S2B_PATTERN_EVIDENCE_KEY",
              "S2B_PATTERN_ALLOWLIST", "AUTHOR_SIDE_GOVERNANCE_PREFLIGHT_NOT_INDEPENDENT_APPROVAL",
          ):
              assert marker in lock, marker
          for forbidden in ("http://", "https://", "socket", "websocket", "requests", "httpx", "credential", "private API", "database", "deployment", "real-money"):
              assert forbidden.lower() not in source.lower(), forbidden
          assert "AUTHOR_PREFLIGHT" in Path("evidence/HCT-IMP-0011-S2B.md").read_text()
          assert "NOT_INDEPENDENT_APPROVAL" in Path("evidence/HCT-IMP-0011-S2B.md").read_text()
          print("S2B pattern contract, pair seam and negative scope: PASS")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.13
          uv sync --project apps/backend --locked --all-groups

      - name: Run S2B IMP-H001-H004 focused correction tests
        run: |
          uv run --project apps/backend pytest -q apps/backend/tests/test_patterns.py -k "imp_h001 or imp_h002 or imp_h003 or imp_h004"

      - name: Run prior-stage regressions and S2B static gates
        run: |
          uv run --project apps/backend pytest --cov=hct_backend --cov-report=term-missing --cov-fail-under=90 apps/backend/tests
          uv run --project apps/backend ruff check apps/backend/src/hct_backend/patterns.py apps/backend/src/hct_backend/pattern_engine.py apps/backend/tests/test_patterns.py scripts/scan_s2b_boundaries.py scripts/benchmark_s2b.py
          uv run --project apps/backend ruff format --check apps/backend/src/hct_backend/patterns.py apps/backend/src/hct_backend/pattern_engine.py apps/backend/tests/test_patterns.py scripts/scan_s2b_boundaries.py scripts/benchmark_s2b.py
          uv run --project apps/backend mypy apps/backend/src
          uv build --project apps/backend --out-dir "$RUNNER_TEMP/hct-backend-dist-s2b"
          uv run --project apps/backend --with pip-audit==2.10.1 pip-audit --local

      - name: Run S2B negative capability and deterministic benchmark gates
        shell: bash
        run: |
          set -euo pipefail
          uv run --project apps/backend python scripts/scan_s2b_boundaries.py
          uv run --project apps/backend python scripts/benchmark_s2b.py --profile all --output "$RUNNER_TEMP/benchmarks-s2b-a.json"
          uv run --project apps/backend python scripts/benchmark_s2b.py --profile all --output "$RUNNER_TEMP/benchmarks-s2b-b.json"
          uv run --project apps/backend python scripts/benchmark_s2b.py --validate "$RUNNER_TEMP/benchmarks-s2b-a.json" "$RUNNER_TEMP/benchmarks-s2b-b.json"

      - name: Run frontend prior-stage regression gates
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Validate frontend without product mutation
        working-directory: apps/frontend
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run lint
          npm exec -- prettier --check src/generated/contracts.ts
          npm run build
          npm audit --audit-level=high --omit=optional

      - name: Publish exact-head implementation summary
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/s2b-summary.md"
          : > "${summary}"
          printf -- '%s\n' '## HCT-IMP-0011-S2B exact-head evidence' >> "${summary}"
          printf -- '- head: `%s`\n' "${HEAD_SHA}" >> "${summary}"
          printf -- '- base: `%s`\n' "${IMPLEMENTATION_BASE_SHA}" >> "${summary}"
          printf -- '- checkpoint: `%s`\n' "${CHECKPOINT_ID}" >> "${summary}"
          printf -- '- implementation: `%s`\n' "${IMPLEMENTATION_ID}" >> "${summary}"
          printf -- '- authorization: `%s`\n' "${AUTHORIZATION_ID}" >> "${summary}"
          printf -- '- %s\n' 'implementation_authorized: true (bounded non-trading ceiling)' >> "${summary}"
          printf -- '- %s\n' 'production_credentials_authorized: false' >> "${summary}"
          printf -- '- %s\n' 'production_deployment_authorized: false' >> "${summary}"
          printf -- '- %s\n' 'limited_live_authorized: false' >> "${summary}"
          printf -- '- %s\n' 'live_trading_authorized: false' >> "${summary}"
          printf -- '- %s\n' 'imp_h001_h004: CLOSED_AUTHOR_SIDE_ONLY pending fresh independent review' >> "${summary}"
          grep -Fq -- "${HEAD_SHA}" "${summary}"
          grep -Fq -- "${IMPLEMENTATION_BASE_SHA}" "${summary}"
          grep -Fq -- "${CHECKPOINT_ID}" "${summary}"
          grep -Fq -- "${IMPLEMENTATION_ID}" "${summary}"
          cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Exact-head summary material verified for head/base/checkpoint/implementation: PASS"
