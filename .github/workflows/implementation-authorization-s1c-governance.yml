name: HCT-IMPL-AUTH-0006 S1C Authorization Governance

on:
  pull_request:
    paths:
      - 'docs/121-implementation-authorization-s1c-candidate.md'
      - 'work-orders/HCT-IMPL-AUTH-0006.md'
      - 'work-orders/HCT-IMP-0006-S1C.md'
      - '.github/workflows/implementation-authorization-s1c-governance.yml'

permissions:
  contents: read

jobs:
  implementation-authorization-s1c-governance:
    runs-on: ubuntu-latest
    env:
      AUTHORIZED_BASE_SHA: cbd0208e05cd875582902a692167230b7a0ac20c
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert exact raw head and canonical base
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "pull_request"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "$AUTHORIZED_BASE_SHA"
          test "$(git rev-parse origin/main)" = "$AUTHORIZED_BASE_SHA"
          test "$(git merge-base "$AUTHORIZED_BASE_SHA" HEAD)" = "$AUTHORIZED_BASE_SHA"
          if grep -Eq '^[[:space:]]*workflow_dispatch:' .github/workflows/implementation-authorization-s1c-governance.yml; then
            echo 'Authorization receipt must not expose workflow_dispatch.'
            exit 1
          fi

      - name: Assert CP0024 fail-closed authority
        shell: bash
        run: |
          set -euo pipefail
          cp='checkpoints/workstreams/planning/latest.json'
          grep -Fq '"checkpoint_id": "HCT-CP-0024"' "$cp"
          grep -Fq '"status": "S1B_IMPLEMENTATION_APPROVED_MERGED"' "$cp"
          grep -Fq '"implementation_authorized": false' "$cp"
          grep -Fq '"implementation_authorization_scope": []' "$cp"
          grep -Fq '"implementation_authorization_ceiling": "NONE_PENDING_NEXT_GOVERNED_AUTHORIZATION"' "$cp"
          grep -Fq '"production_credentials_authorized": false' "$cp"
          grep -Fq '"production_deployment_authorized": false' "$cp"
          grep -Fq '"limited_live_authorized": false' "$cp"
          grep -Fq '"live_trading_authorized": false' "$cp"

      - name: Prove R11 next dependency and V1 classification
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Exchange Abstraction + MEXC adapter;' docs/91-r11-integrated-authority-state-dependency-architecture.md
          grep -Fq 'capability/rule resolver;' docs/91-r11-integrated-authority-state-dependency-architecture.md
          grep -Fq 'universe;' docs/91-r11-integrated-authority-state-dependency-architecture.md
          grep -Fq 'quota/WS governor;' docs/91-r11-integrated-authority-state-dependency-architecture.md
          grep -Fq '**Market Universe Registry** — dynamic discovery of futures contracts actually exposed and eligible through the active exchange adapter.' docs/14-product-module-map.md
          grep -Fq '| 3 | Market Universe Registry | V1_CORE | Dynamic eligible-contract truth. |' docs/92-r11-v1-module-classification-and-integration-hardening.md
          grep -Fq '## R11-REQ-014 — Logical dependency DAG' docs/93-r11-integration-requirements-addendum.md

      - name: Validate four-file governance-only boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$AUTHORIZED_BASE_SHA...HEAD")"
          printf '%s\n' "$changed"
          invalid="$(printf '%s\n' "$changed" | grep -Ev '^(docs/121-implementation-authorization-s1c-candidate\.md|work-orders/HCT-IMPL-AUTH-0006\.md|work-orders/HCT-IMP-0006-S1C\.md|\.github/workflows/implementation-authorization-s1c-governance\.yml)$' || true)"
          if [ -n "$invalid" ]; then
            echo 'Authorization candidate changed files outside the four-file governance boundary:'
            echo "$invalid"
            exit 1
          fi
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4
          git diff --check "$AUTHORIZED_BASE_SHA...HEAD"

      - name: Validate candidate and implementation Work Order invariants
        shell: bash
        run: |
          set -euo pipefail
          candidate='docs/121-implementation-authorization-s1c-candidate.md'
          authwo='work-orders/HCT-IMPL-AUTH-0006.md'
          implwo='work-orders/HCT-IMP-0006-S1C.md'
          grep -Fq 'NON_TRADING_STAGE_1_MARKET_UNIVERSE_REGISTRY_ONLY' "$candidate"
          grep -Fq 'HCT-IMP-0006-S1C' "$candidate"
          grep -Fq 'ELIGIBLE' "$implwo"
          grep -Fq 'INELIGIBLE' "$implwo"
          grep -Fq 'UNKNOWN' "$implwo"
          grep -Fq '## Explicit negative scope' "$implwo"
          grep -Fq '## Required tests' "$implwo"
          grep -Fq '## Static S1C boundary scan' "$implwo"
          grep -Fq '## Evidence artifact' "$implwo"
          grep -Fq '## Implementation CI' "$implwo"
          grep -Fq '## STOP CONDITION' "$implwo"
          grep -Fq 'Exactly four files' "$authwo"

      - name: Confirm higher-risk authority remains closed
        shell: bash
        run: |
          set -euo pipefail
          candidate='docs/121-implementation-authorization-s1c-candidate.md'
          grep -Fq 'production_credentials_authorized=false' "$candidate"
          grep -Fq 'production_deployment_authorized=false' "$candidate"
          grep -Fq 'limited_live_authorized=false' "$candidate"
          grep -Fq 'live_trading_authorized=false' "$candidate"
          grep -Fq 'WebSocket' "$candidate"
          grep -Fq 'realtime market data' "$candidate"
          grep -Fq 'Market Scanner' "$candidate"
          grep -Fq 'persistence/database/RLS' "$candidate"

      - name: Publish authorization summary
        run: |
          echo 'implementation-authorization-s1c-governance is a pull_request-only exact-head receipt.'
          echo 'Subject: authorization candidate for Market Universe Registry only.'
          echo 'No product-code, credentials, deployment, limited-live or live-trading authority exists until a separately reviewed merge and CP0025 promotion.'