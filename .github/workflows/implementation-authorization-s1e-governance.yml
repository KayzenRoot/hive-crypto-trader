name: HCT-IMPL-AUTH-0008 S1E Authorization Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  CANONICAL_BASE_SHA: a92f1093b36b746ff77daa6d28f1ec4cf12f4fcb
  CANDIDATE_AUTHORIZATION_ID: HCT-IMPL-AUTH-0008
  CANDIDATE_IMPLEMENTATION_ID: HCT-IMP-0008-S1E

jobs:
  s1e-authorization-governance:
    name: s1e-authorization-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert pull-request-only exact head, base and canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${{ github.event.pull_request.base.sha }}" = "${CANONICAL_BASE_SHA}"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${CANONICAL_BASE_SHA}"

      - name: Validate CP0028 fail-closed authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path("checkpoints/workstreams/planning/latest.json").read_text())
          checkpoint = json.loads(Path("checkpoints/history/HCT-CP-0028.json").read_text())
          assert latest["checkpoint_id"] == "HCT-CP-0028"
          assert latest["status"] == "S1D_IMPLEMENTATION_APPROVED_MERGED"
          assert latest["implementation_authorized"] is False
          assert latest["implementation_authorization_scope"] == []
          assert latest["implementation_authorization_ceiling"] == "NONE_PENDING_NEXT_GOVERNED_AUTHORIZATION"
          for key in (
              "production_credentials_authorized",
              "production_deployment_authorized",
              "limited_live_authorized",
              "live_trading_authorized",
          ):
              assert latest[key] is False, key
          assert checkpoint["checkpoint_id"] == "HCT-CP-0028"
          assert checkpoint["implementation_authorized"] is False
          assert checkpoint["implementation_authorization_scope"] == []
          assert checkpoint["implementation_authorization_ceiling"] == "NONE_PENDING_NEXT_GOVERNED_AUTHORIZATION"
          print("CP0028 fail-closed authority: PASS")
          PY

      - name: Validate exact governance-only changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "${CANONICAL_BASE_SHA}...${{ github.event.pull_request.head.sha }}" | sort)
          expected=(
            ".github/workflows/implementation-authorization-s1e-governance.yml"
            "docs/127-implementation-authorization-s1e-candidate.md"
            "work-orders/HCT-IMPL-AUTH-0008.md"
            "work-orders/HCT-IMP-0008-S1E.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq "${#expected_sorted[@]}"
          for index in "${!expected_sorted[@]}"; do
            test "${actual[$index]}" = "${expected_sorted[$index]}"
          done
          git diff --check "${CANONICAL_BASE_SHA}...${{ github.event.pull_request.head.sha }}"

      - name: Validate candidate documents and forbid manual dispatch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          candidate = Path("docs/127-implementation-authorization-s1e-candidate.md").read_text()
          authorization = Path("work-orders/HCT-IMPL-AUTH-0008.md").read_text()
          implementation = Path("work-orders/HCT-IMP-0008-S1E.md").read_text()
          workflow = Path(".github/workflows/implementation-authorization-s1e-governance.yml").read_text()
          required_sections = (
              "OBJECTIVE",
              "CONTEXT",
              "SCOPE",
              "OUT OF SCOPE",
              "SOURCE LOCK",
              "REQUIREMENTS",
              "ARCHITECTURE RULES",
              "CONSTRAINTS",
              "ACCEPTANCE CRITERIA",
              "TESTS AND EVIDENCE",
              "DELIVERABLES",
              "REVIEW FORMAT",
              "STOP CONDITION",
          )
          for section in required_sections:
              assert f"## {section}" in implementation, section
          for marker in (
              "HCT-IMPL-AUTH-0008",
              "HCT-IMP-0008-S1E",
              "HCT-CP-0028",
              "a92f1093b36b746ff77daa6d28f1ec4cf12f4fcb",
              "NON_TRADING_STAGE_1_MARKET_TRUTH_FOUNDATION_ONLY",
              "implementation_authorized=false",
              "production_credentials_authorized=false",
              "production_deployment_authorized=false",
              "limited_live_authorized=false",
              "live_trading_authorized=false",
          ):
              assert marker in candidate + authorization + implementation, marker
          for marker in (
              "event identity",
              "event_time",
              "wall_receive_time",
              "monotonic",
              "SEQUENCE_UNPROVABLE",
              "cross-channel contradiction",
              "retired generations",
              "freshness lease",
              "no-authority-upgrade",
              "Module 29",
              "deterministic fixtures/replay",
          ):
              assert marker.lower() in implementation.lower(), marker
          manual_trigger = "workflow" + "_" + "dispatch"
          assert manual_trigger not in workflow
          print("Governance artifact sections and no-manual-trigger rule: PASS")
          PY

      - name: Publish S1E authorization governance summary
        shell: bash
        run: |
          echo "candidateAuthorizationId=${CANDIDATE_AUTHORIZATION_ID}"
          echo "candidateImplementationId=${CANDIDATE_IMPLEMENTATION_ID}"
          echo "canonicalBase=${CANONICAL_BASE_SHA}"
          echo "governanceOnlyDiff=PASS"
          echo "checkpointFailClosed=PASS"
          echo "productImplementation=FORBIDDEN"
          echo "productionCredentials=false"
          echo "productionDeployment=false"
          echo "limitedLive=false"
          echo "liveTrading=false"
