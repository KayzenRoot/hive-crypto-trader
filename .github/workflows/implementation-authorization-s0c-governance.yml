name: HCT-IMPL-AUTH-0003 S0C Authorization Governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/112-implementation-authorization-s0c-candidate.md'
      - 'work-orders/HCT-IMPL-AUTH-0003.md'
      - 'work-orders/HCT-IMP-0003-S0C.md'
      - '.github/workflows/implementation-authorization-s0c-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AUTHORIZED_BASE_SHA: 2cbc7d07adee06bc11e967ff7cfbd7671424cc1d

jobs:
  implementation-authorization-s0c-governance:
    name: implementation-authorization-s0c-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact raw PR head and authorized base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "$AUTHORIZED_BASE_SHA"
          git cat-file -e "$AUTHORIZED_BASE_SHA^{commit}"

      - name: Verify CP0018 canonical fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"checkpoint_id": "HCT-CP-0018"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"status": "S0B_IMPLEMENTATION_APPROVED_MERGED"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"implementation_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"implementation_authorization_scope": []' checkpoints/workstreams/planning/latest.json
          grep -Fq '"implementation_authorization_ceiling": "NONE_PENDING_NEXT_GOVERNED_AUTHORIZATION"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"production_credentials_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"production_deployment_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"limited_live_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"live_trading_authorized": false' checkpoints/workstreams/planning/latest.json

      - name: Verify frozen source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/73-r08-multitenant-security-requirements-addendum.md)" = "c859c0c4a718e3017c34aa50013d4c50959853b4"
          test "$(git hash-object docs/87-r10-observability-audit-incident-finops-requirements-addendum.md)" = "023187ef23b01d5a11f978bbfe6e38abf172bb3b"
          test -s docs/91-r11-integrated-authority-state-dependency-architecture.md
          grep -Fq '### Stage 0 — Canonical contracts/governance/security foundation' docs/91-r11-integrated-authority-state-dependency-architecture.md
          grep -Fq -- '- audit/evidence primitives;' docs/91-r11-integrated-authority-state-dependency-architecture.md
          grep -Fq -- '- configuration/version semantics;' docs/91-r11-integrated-authority-state-dependency-architecture.md

      - name: Verify authorization candidate package
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/112-implementation-authorization-s0c-candidate.md
            work-orders/HCT-IMPL-AUTH-0003.md
            work-orders/HCT-IMP-0003-S0C.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Verify bounded pre-authorization semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Status: `INDEPENDENT_REVIEW_REQUIRED`' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'Status: `PENDING_INDEPENDENT_REVIEW`' work-orders/HCT-IMPL-AUTH-0003.md
          grep -Fq 'Status: `PENDING_AUTHORIZATION`' work-orders/HCT-IMP-0003-S0C.md
          grep -Fq 'HCT-IMP-0003-S0C' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'NON_TRADING_STAGE_0_AUDIT_EVIDENCE_CONFIG_VERSION_FOUNDATION_ONLY' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'Do not begin product implementation' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'S0A and S0B are independently approved and merged' docs/112-implementation-authorization-s0c-candidate.md

      - name: Verify exact frozen requirement locators
        shell: bash
        run: |
          set -euo pipefail
          for locator in SEC-006 R10-REQ-001 R10-REQ-002 R10-REQ-005 R10-REQ-007 R10-REQ-008 R10-REQ-032; do
            grep -Fq "$locator" docs/112-implementation-authorization-s0c-candidate.md
            grep -Fq "$locator" work-orders/HCT-IMP-0003-S0C.md
          done

      - name: Verify higher-risk gates remain closed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'production_credentials_authorized=false' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'production_deployment_authorized=false' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'limited_live_authorized=false' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'live_trading_authorized=false' docs/112-implementation-authorization-s0c-candidate.md

      - name: Verify prohibited S0C capability boundary is explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'real API keys, secret keys, private keys, tokens, seed phrases or secret values' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'MEXC or any exchange client/adapter/REST/WebSocket/authentication/signing' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'database persistence, RLS, append-only database tables' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'external OpenTelemetry collector/exporter/backend' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'production deployment' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'limited-live or real-money trading' docs/112-implementation-authorization-s0c-candidate.md
          grep -Fq 'This is not persistent ledger storage.' work-orders/HCT-IMP-0003-S0C.md
          grep -Fq 'No telemetry/evidence class grants monetary/trading authority.' work-orders/HCT-IMP-0003-S0C.md

      - name: Verify governance-only diff boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          base="origin/${{ github.base_ref }}"
          head="$(git rev-parse HEAD)"
          changed="$(git diff --name-only "$base...$head")"
          printf '%s\n' "$changed"
          invalid="$(printf '%s\n' "$changed" | grep -Ev '^(docs/112-implementation-authorization-s0c-candidate\.md|work-orders/HCT-IMPL-AUTH-0003\.md|work-orders/HCT-IMP-0003-S0C\.md|\.github/workflows/implementation-authorization-s0c-governance\.yml)$' || true)"
          if [ -n "$invalid" ]; then
            echo 'S0C authorization PR contains changes outside governance-only boundary:'
            echo "$invalid"
            exit 1
          fi
          test "$(git merge-base "$base" "$head")" = "$AUTHORIZED_BASE_SHA"
          echo "candidate diff check: $base...$head"
          git diff --check "$base...$head"

      - name: Governance summary
        run: |
          echo 'S0C authorization candidate remains pre-authorization and governance-only.'
          echo 'Bounded subject: audit/evidence integrity plus configuration/release/policy version semantics.'
          echo 'No persistence, external telemetry/config provider, exchange, deployment, limited-live or live-trading authority is granted.'
