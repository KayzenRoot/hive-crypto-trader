name: HCT-IMPL-AUTH-0010 S1F Authorization Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  CANONICAL_BASE_SHA: 625dd0c145087038bdbccd665548d811e187194c
  CANDIDATE_AUTHORIZATION_ID: HCT-IMPL-AUTH-0010
  CANDIDATE_IMPLEMENTATION_ID: HCT-IMP-0010-S1F

jobs:
  s1f-authorization-governance:
    name: s1f-authorization-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert pull-request-only exact head, base and canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${{ github.event.pull_request.base.sha }}" = "${CANONICAL_BASE_SHA}"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${CANONICAL_BASE_SHA}"

      - name: Assert frozen requirement identities and CP0030 fail-closed authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "docs/02-requirements.md": "292da9552ae816e4d51b8a299456305da1658e55",
              "docs/48-r04-execution-requirements-addendum.md": "f20c1ed00bdb13801aaff8a3b648371bfcffba58",
              "docs/54-r05-realtime-requirements-addendum.md": "636ad01da9c25e760dd5e2f033b93a0f04578a17",
              "docs/61-r06-intelligence-requirements-addendum.md": "fea197e60532eb6ff3b11b628b9aabcbcfc00c41",
              "docs/67-r07-validation-laboratory-requirements-addendum.md": "c8a426966c5a0dc34704d1413f506332e770c2c7",
              "docs/73-r08-multitenant-security-requirements-addendum.md": "c859c0c4a718e3017c34aa50013d4c50959853b4",
              "docs/80-r09-cockpit-uiux-requirements-addendum.md": "bc897ebd470857a53055bdee85128b5bd31a5822",
              "docs/87-r10-observability-audit-incident-finops-requirements-addendum.md": "023187ef23b01d5a11f978bbfe6e38abf172bb3b",
              "docs/93-r11-integration-requirements-addendum.md": "6935e9973696d5b706546d63d847ea398780d936",
              "docs/06-test-benchmark-plan.md": "29401ce8fe1616f9390a317bae62d3a157addaa5",
          }
          for path, digest in expected.items():
              actual = subprocess.check_output(["git", "rev-parse", f"HEAD:{path}"], text=True).strip()
              assert actual == digest, (path, actual, digest)

          latest = json.loads(Path("checkpoints/workstreams/planning/latest.json").read_text())
          checkpoint = json.loads(Path("checkpoints/history/HCT-CP-0030.json").read_text())
          for state in (latest, checkpoint):
              assert state["checkpoint_id"] == "HCT-CP-0030"
              assert state["status"] == "S1E_IMPLEMENTATION_APPROVED_MERGED"
              assert state["implementation_authorized"] is False
              assert state["implementation_authorization_scope"] == []
              assert state["implementation_authorization_ceiling"] == "NONE_PENDING_NEXT_GOVERNED_AUTHORIZATION"
              for key in ("production_credentials_authorized", "production_deployment_authorized", "limited_live_authorized", "live_trading_authorized"):
                  assert state[key] is False, key
          print("Frozen requirement identities 10/10: PASS")
          print("CP0030 fail-closed authority: PASS")
          PY

      - name: Validate exact governance-only changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "${CANONICAL_BASE_SHA}...${{ github.event.pull_request.head.sha }}" | sort)
          expected=(
            ".github/workflows/implementation-authorization-s1f-governance.yml"
            "docs/131-implementation-authorization-s1f-candidate.md"
            "work-orders/HCT-IMPL-AUTH-0010.md"
            "work-orders/HCT-IMP-0010-S1F.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq "${#expected_sorted[@]}"
          for index in "${!expected_sorted[@]}"; do test "${actual[$index]}" = "${expected_sorted[$index]}"; done
          git diff --check "${CANONICAL_BASE_SHA}...${{ github.event.pull_request.head.sha }}"

      - name: Validate typed plane, deterministic contracts and negative firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          candidate = Path("docs/131-implementation-authorization-s1f-candidate.md").read_text()
          authorization = Path("work-orders/HCT-IMPL-AUTH-0010.md").read_text()
          implementation = Path("work-orders/HCT-IMP-0010-S1F.md").read_text()
          workflow = Path(".github/workflows/implementation-authorization-s1f-governance.yml").read_text()
          combined = candidate + authorization + implementation

          for section in ("OBJECTIVE", "CONTEXT", "SCOPE", "OUT OF SCOPE", "FILES AND SOURCE LOCK", "ARCHITECTURE RULES", "CONSTRAINTS", "ACCEPTANCE CRITERIA", "TESTS AND BENCHMARK EVIDENCE", "DELIVERABLES", "REVIEW FORMAT", "STOP CONDITION"):
              assert f"## {section}" in candidate or f"## {section}" in authorization or f"## {section}" in implementation, section
          for marker in (
              "HCT-IMPL-AUTH-0010", "HCT-IMP-0010-S1F", "HCT-CP-0030", os.environ["CANONICAL_BASE_SHA"],
              "Realtime Public Market Value Plane & Ingest Foundation", "TradeTick", "TickerState", "CandleBar",
              "OrderBookSnapshot", "OrderBookDelta", "BookLevel", "ReferencePriceEvidence", "FundingEvidence",
              "Decimal", "NaN", "Infinity", "divide-by-zero", "overflow", "canonical serialization",
              "ordered manifest", "Merkle", "event_time", "knowledge_time", "wall_receive_time", "monotonic",
              "interval", "timeframe", "generation", "provenance", "MarketStateTrust", "DataAuthority",
              "RESOURCE_DEGRADED", "INELIGIBLE", "UNKNOWN", "STALE", "GAP", "SEQUENCE_UNPROVABLE",
              "CLOCK_UNTRUSTED", "RETIRED_GENERATION", "STAGE", "docs/06-test-benchmark-plan.md",
              "R05::", "INT-", "VAL-", "R11-REQ-", "HCT-DEC-", "ADR-0049", "negative-capability",
              "implementation_authorized=false", "production_credentials_authorized=false",
              "production_deployment_authorized=false", "limited_live_authorized=false", "live_trading_authorized=false",
          ):
              assert marker in combined, marker
          exact_decisions = (
              "S1F_TRANSPORT_MODE=NECESSARY_PUBLIC_UNAUTHENTICATED",
              "S1F_MEXC_SOURCE_URL=https://mexcdevelop.github.io/apidocs/contract_v1_en/",
              "S1F_MEXC_SOURCE_RETRIEVED=2026-09-13",
              "S1F_MEXC_SOURCE_SHA256=57ebc13fea788a1c568c8aeabfdf50acc0c9f5b5a882af4855837d53499940e",
              "S1F_MEXC_WS_URL=wss://contract.mexc.com/edge",
              "S1F_MEXC_PUBLIC_CHANNELS=sub.tickers,sub.ticker,sub.deal,sub.depth,sub.depth.full,sub.kline",
              "S1F_MEXC_PING_POLICY=ping every 10-20 seconds; disconnect if no ping within 1 minute",
              "S1F_MEXC_SOURCE_CONTRACT_VERSION=S1F_MEXC_SOURCE_CONTRACT_V1",
              "S1F_MEXC_PRIMARY_SOURCE_MATRIX=TradeTick:sub.deal;TickerState:sub.ticker;BulkTicker:sub.tickers;CandleBar:sub.kline;OrderBookSnapshot:REST:/api/v1/contract/depth/{symbol};OrderBookDelta:sub.depth:compress=false;FullDepth:sub.depth.full;ReferencePriceEvidence:sub.ticker;FundingEvidence:sub.ticker",
              "S1F_MEXC_TICKER_PRIMARY=WS sub.ticker -> push.ticker;data.lastPrice,bid1,ask1,volume24,holdVol,indexPrice,fairPrice,fundingRate,timestamp;outer.symbol,outer.ts",
              "S1F_MEXC_REFERENCE_PRIMARY=WS sub.ticker;MARK=fairPrice;FAIR=fairPrice;INDEX=indexPrice;dedicated_channels=OPTIONAL_CORROBORATION",
              "S1F_MEXC_FUNDING_PRIMARY=WS sub.ticker;fundingRate+timestamp;dedicated_channel=OPTIONAL_CORROBORATION",
              "S1F_MEXC_NO_OTHER_PUBLIC_ENDPOINTS=GOVERNED_SOURCE_CONTRACT_CHANGE_REQUIRED",
              "S1F_MEXC_WS_TS_UNIT=MILLISECONDS",
              "S1F_MEXC_TICKER_TIMESTAMP_UNIT=MILLISECONDS",
              "S1F_MEXC_KLINE_T_UNIT=SECONDS",
              "S1F_MEXC_KLINE_T_MEANING=windowStart",
              "S1F_MEXC_DEAL_T_UNIT=EPOCH_MILLISECONDS_STRICT_13_DIGIT_VALIDATOR",
              "S1F_MEXC_DEAL_T_AUTODETECT=REJECTED",
              "S1F_MEXC_DEPTH_SNAPSHOT_REST=GET /api/v1/contract/depth/{symbol}",
              "S1F_MEXC_DEPTH_RECOVERY_REST=GET /api/v1/contract/depth_commits/{symbol}/{limit}",
              "S1F_MEXC_DEPTH_SUBSCRIPTION=method=sub.depth;compress=false",
              "S1F_MEXC_DEPTH_TUPLE=price,order_count,order_quantity",
              "S1F_MEXC_DEPTH_QUANTITY=third_element_order_quantity",
              "S1F_MEXC_DEPTH_VERSION_RULE=next_version=previous_version+1;else=GAP_RESYNC_REQUIRED",
              "S1F_MEXC_DEPTH_ZERO_QUANTITY=REMOVE_LEVEL",
              "S1F_MEXC_FULL_DEPTH_LIMITS=5,10,20",
              "S1F_MEXC_FULL_DEPTH_IDENTITY=subscription_context_required",
              "S1F_MEXC_CANDLE_CLOSE_PROOF=NEXT_WINDOW_OR_REST_CONFIRMATION",
              "S1F_MEXC_KLINE_FINAL_FLAG=ABSENT;DO_NOT_FABRICATE",
              "S1F_MEXC_DECIMAL_PARSE=LEXICAL_PROVIDER_TOKEN_TO_DECIMAL_NO_BINARY_FLOAT",
              "S1F_MEXC_FIXTURE_MANIFEST=source_url;retrieved;source_sha256;normalized_schema_version;fixture_hashes",
              "S1F_NO_PRIVATE_CHANNELS=true",
              "S1F_DECODE_BOUNDARY=provider payload -> quarantine/schema validation -> canonical typed public value event",
              "S1F_SESSION_GENERATION=each connection/reconnection creates a generation; retired generations cannot publish",
              "S1F_NUMERIC_TYPE=Decimal",
              "S1F_NUMERIC_POLICY_VERSION=DECIMAL_TEXT_V1",
              "S1F_NUMERIC_MAX_PRECISION=38",
              "S1F_NUMERIC_MAX_SCALE=18",
              "S1F_NUMERIC_MAX_INTEGER_DIGITS=20",
              "S1F_NUMERIC_GRAMMAR=base-10 decimal text; no exponent; no leading plus; canonical zero",
              "S1F_FLOAT_INPUT=REJECTED",
              "S1F_RAW_VALUES=exact; no raw rounding; no raw quantization",
              "S1F_INTERVAL_MODEL=HALF_OPEN_START_INCLUSIVE_END_EXCLUSIVE",
              "S1F_TIMEZONE=UTC",
              "S1F_ALIGNMENT=UNIX_EPOCH_MULTIPLES",
              "S1F_KNOWLEDGE_ADMISSIBILITY=knowledge_time",
              "S1F_CANDLE_FINALITY=OPEN_UNTIL_BOUNDARY_AND_SOURCE_FINALITY",
              "S1F_LATE_CORRECTION=NEW_IMMUTABLE_REVISION",
              "S1F_VALUE_FAMILIES=TradeTick,TickerState,CandleBar,OrderBookSnapshot,OrderBookDelta,BookLevel,ReferencePriceEvidence,FundingEvidence",
              "S1F_CAPABILITY_STATES=SUPPORTED,UNSUPPORTED,UNKNOWN",
              "S1F_BENCHMARK_MODE=BASELINE_ESTABLISHMENT_V1",
              "S1F_PROFILE_CONTRACT_MICRO_V1=symbols=1;ticker=64;deal=256;depth=128;depth-full=32;kline=32;total=512;depth-levels=5;replay-seconds=60",
              "S1F_PROFILE_NOMINAL_MULTICHANNEL_V1=symbols=8;ticker=1024;deal=4096;depth=2048;depth-full=512;kline=512;total=8192;depth-levels=20;replay-seconds=900",
              "S1F_PROFILE_STRESS_BACKPRESSURE_V1=symbols=32;ticker=8192;deal=32768;depth=16384;depth-full=4096;kline=4096;total=65536;depth-levels=20;queue-capacity=4096;replay-seconds=3600",
              "S1F_BENCHMARK_MEASUREMENTS=normalization_throughput;value_state_latency_distribution;replay_throughput;peak_steady_memory;queue_depth_age",
          )
          for decision in exact_decisions:
              assert decision in combined, decision
          assert "https://mexcdevelop.github.io/apidocs/contract_v1_en/" in implementation
          assert "57ebc13fea788a1c568c8aeabfdf50acc0c9f5b5a882af4855837d53499940e" in implementation
          for document in (candidate, implementation):
              assert "## NORMALIZED MEXC SOURCE CONTRACT" in document
              for matrix_fragment in (
                  "TradeTick", "WS `sub.deal` -> `push.deal`", "TickerState", "WS `sub.ticker` -> `push.ticker`",
                  "Bulk ticker projection", "WS `sub.tickers` -> `push.tickers`", "CandleBar", "WS `sub.kline` -> `push.kline`",
                  "OrderBookSnapshot", "GET /api/v1/contract/depth/{symbol}", "OrderBookDelta", "compress=false",
                  "Bounded full-depth projection", "sub.depth.full", "ReferencePriceEvidence", "FundingEvidence",
                  "OPTIONAL_CORROBORATION", "S1F_MEXC_SOURCE_CONTRACT_VERSION=S1F_MEXC_SOURCE_CONTRACT_V1",
                  "S1F_MEXC_NO_OTHER_PUBLIC_ENDPOINTS=GOVERNED_SOURCE_CONTRACT_CHANGE_REQUIRED",
                  "S1F_MEXC_DEPTH_RECOVERY_REST=GET /api/v1/contract/depth_commits/{symbol}/{limit}",
                  "S1F_MEXC_DEPTH_TUPLE=price,order_count,order_quantity",
                  "S1F_MEXC_DEPTH_VERSION_RULE=next_version=previous_version+1;else=GAP_RESYNC_REQUIRED",
                  "S1F_MEXC_CANDLE_CLOSE_PROOF=NEXT_WINDOW_OR_REST_CONFIRMATION",
                  "S1F_MEXC_KLINE_FINAL_FLAG=ABSENT;DO_NOT_FABRICATE",
                  "S1F_MEXC_DECIMAL_PARSE=LEXICAL_PROVIDER_TOKEN_TO_DECIMAL_NO_BINARY_FLOAT",
                  "S1F_MEXC_FIXTURE_MANIFEST=source_url;retrieved;source_sha256;normalized_schema_version;fixture_hashes",
              ):
                  assert matrix_fragment in document, matrix_fragment
          assert candidate.count("S1F_MEXC_PUBLIC_CHANNELS=sub.tickers,sub.ticker,sub.deal,sub.depth,sub.depth.full,sub.kline") >= 1
          assert implementation.count("S1F_MEXC_PUBLIC_CHANNELS=sub.tickers,sub.ticker,sub.deal,sub.depth,sub.depth.full,sub.kline") >= 1
          assert "explicit final/closed boolean" in candidate
          assert "never auto-detect seconds versus milliseconds" in implementation
          assert "Decimal or" not in combined
          assert "equivalent fixed-point" not in combined
          assert "implementation discretion" not in combined
          assert "if objectively required" not in combined
          assert "only if frozen" not in combined
          assert "transport is in scope" not in combined
          assert "only if that boundary is authorized" not in combined
          for forbidden in ("credential", "private API", "Risk", "OMS", "Execution", "persistence", "deployment", "live trading"):
              assert forbidden.lower() in combined.lower(), forbidden
          manual_trigger = "workflow" + "_" + "dispatch"
          assert manual_trigger not in workflow
          print("Typed value plane, numeric policy, ordered lineage, interval semantics and S1E axis separation: PASS")
          print("docs/06 benchmark binding and negative firewall: PASS")
          PY

      - name: Publish S1F authorization governance summary
        shell: bash
        run: |
          echo "candidateAuthorizationId=${CANDIDATE_AUTHORIZATION_ID}"
          echo "candidateImplementationId=${CANDIDATE_IMPLEMENTATION_ID}"
          echo "canonicalBase=${CANONICAL_BASE_SHA}"
          echo "governanceOnlyDiff=PASS"
          echo "sourceIdentity=10/10 PASS"
          echo "checkpointFailClosed=PASS"
          echo "h001TransportMandatory=PASS"
          echo "mexcOfficialSourceLock=PASS"
          echo "h002CanonicalNumericPolicy=PASS"
          echo "h003HalfOpenInterval=PASS"
          echo "h004ValueFamilyManifest=PASS"
          echo "h005BenchmarkProfiles=PASS"
          echo "h006SemanticAssertions=PASS"
          echo "orderedInputLineage=PASS"
          echo "s1eAxisSeparation=PASS"
          echo "docs06Bound=PASS"
          echo "productImplementation=FORBIDDEN"
          echo "productionCredentials=false"
          echo "productionDeployment=false"
          echo "limitedLive=false"
          echo "liveTrading=false"
