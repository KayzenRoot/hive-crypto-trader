              assert decision in combined, decision
          assert "https://mexcdevelop.github.io/apidocs/contract_v1_en/" in implementation
          source_sha = "57ebc13fea788a1c568c8aeabfdf50acc0c9f5b5a882af4855837d53499940e3"
          assert re.fullmatch(r"[0-9a-f]{64}", source_sha)
