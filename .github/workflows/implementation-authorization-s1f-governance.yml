name: HCT-IMPL-AUTH-0010 S1F Authorization Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  CANONICAL_BASE_SHA: 625dd0c145087038bdbccd665548d811e187194c
  CANDIDATE_AUTHORIZATION_ID: HCT-IMPL-AUTH-0010
  CANDIDATE_IMPLEMENTATION_ID: HCT-IMP-0010-S1F

jobs:
  s1f-authorization-governance:
    name: s1f-authorization-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert pull-request-only exact head, base and canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${{ github.event.pull_request.base.sha }}" = "${CANONICAL_BASE_SHA}"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${CANONICAL_BASE_SHA}"

      - name: Assert frozen requirement identities and CP0030 fail-closed authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              "docs/02-requirements.md": "292da9552ae816e4d51b8a299456305da1658e55",
              "docs/48-r04-execution-requirements-addendum.md": "f20c1ed00bdb13801aaff8a3b648371bfcffba58",
              "docs/54-r05-realtime-requirements-addendum.md": "636ad01da9c25e760dd5e2f033b93a0f04578a17",
              "docs/61-r06-intelligence-requirements-addendum.md": "fea197e60532eb6ff3b11b628b9aabcbcfc00c41",
              "docs/67-r07-validation-laboratory-requirements-addendum.md": "c8a426966c5a0dc34704d1413f506332e770c2c7",
              "docs/73-r08-multitenant-security-requirements-addendum.md": "c859c0c4a718e3017c34aa50013d4c50959853b4",
              "docs/80-r09-cockpit-uiux-requirements-addendum.md": "bc897ebd470857a53055bdee85128b5bd31a5822",
              "docs/87-r10-observability-audit-incident-finops-requirements-addendum.md": "023187ef23b01d5a11f978bbfe6e38abf172bb3b",
              "docs/93-r11-integration-requirements-addendum.md": "6935e9973696d5b706546d63d847ea398780d936",
              "docs/06-test-benchmark-plan.md": "29401ce8fe1616f9390a317bae62d3a157addaa5",
          }
          for path, digest in expected.items():
              actual = subprocess.check_output(["git", "rev-parse", f"HEAD:{path}"], text=True).strip()
              assert actual == digest, (path, actual, digest)

          latest = json.loads(Path("checkpoints/workstreams/planning/latest.json").read_text())
          checkpoint = json.loads(Path("checkpoints/history/HCT-CP-0030.json").read_text())
          for state in (latest, checkpoint):
              assert state["checkpoint_id"] == "HCT-CP-0030"
              assert state["status"] == "S1E_IMPLEMENTATION_APPROVED_MERGED"
              assert state["implementation_authorized"] is False
              assert state["implementation_authorization_scope"] == []
              assert state["implementation_authorization_ceiling"] == "NONE_PENDING_NEXT_GOVERNED_AUTHORIZATION"
              for key in ("production_credentials_authorized", "production_deployment_authorized", "limited_live_authorized", "live_trading_authorized"):
                  assert state[key] is False, key
          print("Frozen requirement identities 10/10: PASS")
          print("CP0030 fail-closed authority: PASS")
          PY

      - name: Validate exact governance-only changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "${CANONICAL_BASE_SHA}...${{ github.event.pull_request.head.sha }}" | sort)
          expected=(
            ".github/workflows/implementation-authorization-s1f-governance.yml"
            "docs/131-implementation-authorization-s1f-candidate.md"
            "work-orders/HCT-IMPL-AUTH-0010.md"
            "work-orders/HCT-IMP-0010-S1F.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq "${#expected_sorted[@]}"
          for index in "${!expected_sorted[@]}"; do test "${actual[$index]}" = "${expected_sorted[$index]}"; done
          git diff --check "${CANONICAL_BASE_SHA}...${{ github.event.pull_request.head.sha }}"

      - name: Validate typed plane, deterministic contracts and negative firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          candidate = Path("docs/131-implementation-authorization-s1f-candidate.md").read_text()
          authorization = Path("work-orders/HCT-IMPL-AUTH-0010.md").read_text()
          implementation = Path("work-orders/HCT-IMP-0010-S1F.md").read_text()
          workflow = Path(".github/workflows/implementation-authorization-s1f-governance.yml").read_text()
          combined = candidate + authorization + implementation

          for section in ("OBJECTIVE", "CONTEXT", "SCOPE", "OUT OF SCOPE", "FILES AND SOURCE LOCK", "ARCHITECTURE RULES", "CONSTRAINTS", "ACCEPTANCE CRITERIA", "TESTS AND BENCHMARK EVIDENCE", "DELIVERABLES", "REVIEW FORMAT", "STOP CONDITION"):
              assert f"## {section}" in candidate or f"## {section}" in authorization or f"## {section}" in implementation, section
          for marker in (
              "HCT-IMPL-AUTH-0010", "HCT-IMP-0010-S1F", "HCT-CP-0030", os.environ["CANONICAL_BASE_SHA"],
              "Realtime Public Market Value Plane & Ingest Foundation", "TradeTick", "TickerState", "CandleBar",
              "Decimal", "fixed-point", "NaN", "Infinity", "divide-by-zero", "overflow", "canonical serialization",
              "ordered manifest", "Merkle", "event_time", "knowledge_time", "wall_receive_time", "monotonic",
              "interval", "timeframe", "generation", "provenance", "MarketStateTrust", "DataAuthority",
              "RESOURCE_DEGRADED", "INELIGIBLE", "UNKNOWN", "STALE", "GAP", "SEQUENCE_UNPROVABLE",
              "CLOCK_UNTRUSTED", "RETIRED_GENERATION", "STAGE", "docs/06-test-benchmark-plan.md",
              "R05::", "INT-", "VAL-", "R11-REQ-", "HCT-DEC-", "ADR-0049", "negative-capability",
              "implementation_authorized=false", "production_credentials_authorized=false",
              "production_deployment_authorized=false", "limited_live_authorized=false", "live_trading_authorized=false",
          ):
              assert marker in combined, marker
          for forbidden in ("credential", "private API", "Risk", "OMS", "Execution", "persistence", "deployment", "live trading"):
              assert forbidden.lower() in combined.lower(), forbidden
          manual_trigger = "workflow" + "_" + "dispatch"
          assert manual_trigger not in workflow
          print("Typed value plane, numeric policy, ordered lineage, interval semantics and S1E axis separation: PASS")
          print("docs/06 benchmark binding and negative firewall: PASS")
          PY

      - name: Publish S1F authorization governance summary
        shell: bash
        run: |
          echo "candidateAuthorizationId=${CANDIDATE_AUTHORIZATION_ID}"
          echo "candidateImplementationId=${CANDIDATE_IMPLEMENTATION_ID}"
          echo "canonicalBase=${CANONICAL_BASE_SHA}"
          echo "governanceOnlyDiff=PASS"
          echo "sourceIdentity=10/10 PASS"
          echo "checkpointFailClosed=PASS"
          echo "typedValuePlane=DECLARED"
          echo "orderedInputLineage=DECLARED"
          echo "intervalSemantics=DECLARED"
          echo "s1eAxisSeparation=DECLARED"
          echo "docs06Bound=PASS"
          echo "productImplementation=FORBIDDEN"
          echo "productionCredentials=false"
          echo "productionDeployment=false"
          echo "limitedLive=false"
          echo "liveTrading=false"
