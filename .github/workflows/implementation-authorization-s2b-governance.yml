name: HCT-IMPL-AUTH-0011 S2B Authorization Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  CANONICAL_BASE_SHA: c198a99167fa571802b16f6daf77b253a2b100b0
  CHECKPOINT_ID: HCT-CP-0034
  CHECKPOINT_STATUS: S2A_IMPLEMENTATION_APPROVED_MERGED
  CANDIDATE_AUTHORIZATION_ID: HCT-IMPL-AUTH-0011
  CANDIDATE_IMPLEMENTATION_ID: HCT-IMP-0011-S2B
  RESOLVED_PREREQUISITE: HCT-IMP-0009-S2A
  FROZEN_BASELINE_ID: HCT-REQ-BASELINE-V1-CANDIDATE
  S2B_SLICE_NAME: Candlestick Pattern Foundation
  CHART_STRUCTURE_DISPOSITION: REQUIRED_FOLLOW_ON_MODULE9_SLICE_BEFORE_REGIME

jobs:
  s2b-authorization-governance:
    name: s2b-authorization-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert pull-request-only exact head, base and canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${{ github.event.pull_request.base.sha }}" = "${CANONICAL_BASE_SHA}"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${CANONICAL_BASE_SHA}"

      - name: Validate CP0034 canonical closure and fail-closed authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path("checkpoints/workstreams/planning/latest.json").read_text())
          checkpoint = json.loads(Path("checkpoints/history/HCT-CP-0034.json").read_text())
          keys = (
              "checkpoint_id", "status", "implementation_merge_sha", "approved_candidate_head_sha",
              "exact_head_ci_run", "exact_head_ci_check", "exact_head_ci_job", "exact_head_ci_conclusion",
              "independent_review_id", "independent_verdict", "critical_findings_unresolved",
              "high_findings_unresolved", "implementation_authorized", "implementation_authorization_scope",
              "implementation_authorization_ceiling", "production_credentials_authorized",
              "production_deployment_authorized", "limited_live_authorized", "live_trading_authorized",
          )
          for key in keys:
              assert checkpoint[key] == latest[key], key
          assert checkpoint["checkpoint_id"] == "HCT-CP-0034"
          assert checkpoint["status"] == "S2A_IMPLEMENTATION_APPROVED_MERGED"
          assert checkpoint["prior_checkpoint"] == "HCT-CP-0033"
          assert checkpoint["completed_increment"] == "HCT-IMP-0009-S2A"
          assert checkpoint["implementation_pr"] == 74
          assert checkpoint["approved_candidate_head_sha"] == "40e67302fb80e329429be50430584ff9523a12a0"
          assert checkpoint["implementation_merge_sha"] == "c862e5670465ef0f8d0c77dce163a1ece7c92ac4"
          assert checkpoint["implementation_authorized"] is False
          assert checkpoint["implementation_authorization_scope"] == []
          assert checkpoint["implementation_authorization_ceiling"] == "NONE_PENDING_NEXT_GOVERNED_AUTHORIZATION"
          for key in ("production_credentials_authorized", "production_deployment_authorized", "limited_live_authorized", "live_trading_authorized"):
              assert checkpoint[key] is False, key
          assert checkpoint["independent_review_id"] == 5220668487
          assert checkpoint["independent_verdict"] == "APPROVED"
          assert checkpoint["critical_findings_unresolved"] == 0
          assert checkpoint["high_findings_unresolved"] == 0
          assert checkpoint["imp_h001_h008_status"] == "CLOSED"
          print("CP0034 canonical closure and fail-closed authority: PASS")
          PY

      - name: Validate exact governance-only changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "${CANONICAL_BASE_SHA}...${{ github.event.pull_request.head.sha }}" | sort)
          expected=(
            ".github/workflows/implementation-authorization-s2b-governance.yml"
            "docs/136-implementation-authorization-s2b-candidate.md"
            "work-orders/HCT-IMPL-AUTH-0011.md"
            "work-orders/HCT-IMP-0011-S2B.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq "${#expected_sorted[@]}"
          for index in "${!expected_sorted[@]}"; do test "${actual[$index]}" = "${expected_sorted[$index]}"; done
          if printf '%s\n' "${actual[@]}" | grep -Eqv '^(\.github/workflows/implementation-authorization-s2b-governance\.yml|docs/136-implementation-authorization-s2b-candidate\.md|work-orders/HCT-IMPL-AUTH-0011\.md|work-orders/HCT-IMP-0011-S2B\.md)$'; then
            echo "A path outside the authorized four-file governance boundary changed."
            exit 1
          fi
          git diff --check "${CANONICAL_BASE_SHA}...${{ github.event.pull_request.head.sha }}"
          echo "Governance-only four-file boundary: PASS"

      - name: Validate full frozen planning package and requirement source identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          base = os.environ["CANONICAL_BASE_SHA"]
          groups = {
              "frozen planning package": {
                  "docs/00-source-hierarchy.md": "a195814d7514e438f3a1c7ec3eded494595e4817",
                  "docs/03-scope.md": "3ecc8d6c8d1540005dbd78b7e7569ccbd010f22a",
                  "docs/04-architecture.md": "24f2e7c72de5a9c9b362fb5e34ebfd7bcc076725",
                  "docs/06-test-benchmark-plan.md": "29401ce8fe1616f9390a317bae62d3a157addaa5",
                  "docs/09-definition-of-done.md": "53741dab7a3e3ebfaf1a61ef89b638cb97e17cb1",
                  "docs/10-decisions-ledger.md": "98697c87928dce8f53f32e23e7fefb6acd3bb7d3",
                  "docs/92-r11-v1-module-classification-and-integration-hardening.md": "aea9d476a6cf14f0e9e58872a48094aeda2f154f",
                  "docs/99-r12-frozen-requirements-baseline.md": "cdaf66eab10f650292908679efbb7d0ec400ebf9",
                  "docs/100-r12-requirements-traceability-and-no-loss-proof.md": "2ef416b4ea06e2aaee8b3545e1022f3459f3d647",
                  "docs/101-r12-freeze-governance-change-control-and-deferred-decisions.md": "5ec4003c577fc4875c5cad494e8877f731d3f943",
                  "docs/05-security.md": "4f63f584ee7f169402c5609ead7aa64304248bc0",
                  "docs/14-product-module-map.md": "f2e254e493ed27a31c4986f006e6455bc1b58c3e",
                  "docs/91-r11-integrated-authority-state-dependency-architecture.md": "faa7d0fc35481a73e0c5ae204a80e57d4856ef61",
                  "docs/102-r12-freeze-acceptance-matrix.md": "886703addb72f277033005ea33e80bfa5f007766",
                  "docs/103-r12-final-planning-freeze-audit.md": "9748ac220bdf83faa4579bfe8c6856eb28895712",
                  "docs/105-r12-freeze-approval-and-checkpoint-promotion.md": "b95db9084312efac70af7f2c4ef71f34c7ae6cd4",
                  "checkpoints/history/HCT-CP-0014.json": "99c94f226b7beb454c946fb6eb0fc9628a54531f",
              },
              "frozen requirement source blobs": {
                  "docs/02-requirements.md": "292da9552ae816e4d51b8a299456305da1658e55",
                  "docs/48-r04-execution-requirements-addendum.md": "f20c1ed00bdb13801aaff8a3b648371bfcffba58",
                  "docs/54-r05-realtime-requirements-addendum.md": "636ad01da9c25e760dd5e2f033b93a0f04578a17",
                  "docs/61-r06-intelligence-requirements-addendum.md": "fea197e60532eb6ff3b11b628b9aabcbcfc00c41",
                  "docs/67-r07-validation-laboratory-requirements-addendum.md": "c8a426966c5a0dc34704d1413f506332e770c2c7",
                  "docs/73-r08-multitenant-security-requirements-addendum.md": "c859c0c4a718e3017c34aa50013d4c50959853b4",
                  "docs/80-r09-cockpit-uiux-requirements-addendum.md": "bc897ebd470857a53055bdee85128b5bd31a5822",
                  "docs/87-r10-observability-audit-incident-finops-requirements-addendum.md": "023187ef23b01d5a11f978bbfe6e38abf172bb3b",
                  "docs/93-r11-integration-requirements-addendum.md": "6935e9973696d5b706546d63d847ea398780d936",
              },
              "CP0034/S2A handoff lock": {
                  "checkpoints/history/HCT-CP-0034.json": "3003d873c343bf3fa31105c4dc0fd238f2bbe7fd",
                  "checkpoints/workstreams/planning/latest.json": "0ac37f9daaa96a3f8ecdd53bc5bf9a397915559c",
                  "docs/134-s2a-implementation-authorization-and-checkpoint-promotion.md": "2c88dfc05dff16c767c0e1b4b206787f4dfe183b",
                  "docs/135-s2a-implementation-approval-and-checkpoint-promotion.md": "7807b67d4270c46ab206a3ecfdb39cf028d5b148",
                  "work-orders/HCT-IMP-0009-S2A.md": "592a07e6066b9ad28c1d626308338468ba548cbe",
                  "apps/backend/src/hct_backend/features.py": "40dba614d6a146c42fc7c4755416bcedd55a7f1c",
                  "apps/backend/src/hct_backend/feature_engine.py": "a46bca1b82ce0d9b168af5cf7b34a06ee2ef5f38",
              },
          }
          expected_sizes = {
              "frozen planning package": 17,
              "frozen requirement source blobs": 9,
              "CP0034/S2A handoff lock": 7,
          }
          for label, group in groups.items():
              assert len(group) == expected_sizes[label], label
              for path, digest in group.items():
                  actual = subprocess.check_output(["git", "rev-parse", f"{base}:{path}"], text=True).strip()
                  assert actual == digest, (label, path, actual, digest)
          print("Full frozen planning package, requirement source blobs and CP0034/S2A handoff: PASS")
          PY

      - name: Validate frozen package semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess

          base = os.environ["CANONICAL_BASE_SHA"]

          def read(path):
              return subprocess.check_output(["git", "show", f"{base}:{path}"], text=True)

          cp0014 = json.loads(read("checkpoints/history/HCT-CP-0014.json"))
          assert cp0014["checkpoint_id"] == "HCT-CP-0014"
          assert cp0014["status"] == "PLANNING_FREEZE_APPROVED"
          assert cp0014["completed_increment"] == "HCT-PLAN-0001-R12"
          assert cp0014["functional_planning_frozen"] is True
          assert cp0014["implementation_authorized"] is False
          for key in ("production_credentials_authorized", "production_deployment_authorized", "limited_live_authorized", "live_trading_authorized"):
              assert cp0014[key] is False, key

          module_map = read("docs/14-product-module-map.md")
          assert "Candlestick & Chart Pattern Engine" in module_map
          assert "No accepted module may silently disappear" in module_map

          integrated = read("docs/91-r11-integrated-authority-state-dependency-architecture.md")
          assert "features/indicators/patterns" in integrated
          assert "Restrictive authority lattice" in integrated
          assert "intersection of independent restrictive domains" in integrated
          stage2 = integrated.split("### Stage 2")[1].split("### Stage 3")[0]
          order = [stage2.index(token) for token in ("features/indicators/patterns", "regime", "scanner", "strategy engine/catalog/signal", "minimum microstructure")]
          assert order == sorted(order), "Stage 2 dependency order drifted"

          security = read("docs/05-security.md")
          for marker in ("No secret, exchange credential", "private key", "tenant", "account", "authority boundaries"):
              assert marker in security, marker

          promotion = read("docs/105-r12-freeze-approval-and-checkpoint-promotion.md")
          assert "FREEZE_APPROVED" in promotion
          assert "HCT-CP-0014" in promotion
          assert "HCT-PLAN-0001-R12" in promotion

          print("CP0014 freeze approval, module map, R11 Stage 2 order, security invariants and R12 promotion semantics: PASS")
          PY

      - name: Validate traceability, Module 9 scope integrity and candlestick semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          candidate = Path("docs/136-implementation-authorization-s2b-candidate.md").read_text()
          authorization = Path("work-orders/HCT-IMPL-AUTH-0011.md").read_text()
          implementation = Path("work-orders/HCT-IMP-0011-S2B.md").read_text()
          workflow = Path(".github/workflows/implementation-authorization-s2b-governance.yml").read_text()
          combined = candidate + "\n" + authorization + "\n" + implementation
          baseline = os.environ["FROZEN_BASELINE_ID"]

          # 1. frozen baseline traceability and governing locators
          traceability = (
              "S2B_FROZEN_BASELINE=" + baseline,
              "S2B_PLANNING_FREEZE=HCT-CP-0014/PLANNING_FREEZE_APPROVED",
              "S2B_DOD_SECTIONS=2,4,5,11",
              "docs/00-source-hierarchy.md", "docs/03-scope.md", "docs/04-architecture.md",
              "docs/06-test-benchmark-plan.md", "docs/09-definition-of-done.md",
              "docs/10-decisions-ledger.md",
              "docs/92-r11-v1-module-classification-and-integration-hardening.md",
              "docs/99-r12-frozen-requirements-baseline.md",
              "docs/100-r12-requirements-traceability-and-no-loss-proof.md",
              "docs/101-r12-freeze-governance-change-control-and-deferred-decisions.md",
              "REQ02::Trading intelligence requirements::B2",
              "R11-REQ-012", "R11-REQ-014", "R11-REQ-015", "R11-REQ-023",
              "HCT-DEC-0140", "HCT-DEC-0141", "V1_MINIMUM", "silent scope deletion",
          )
          for marker in traceability:
              assert marker in combined, marker

          # 2. Module 9 scope integrity: candlestick slice plus required follow-on, never
          #    an exclusion of the chart/market-structure half.
          assert "S2B_SLICE_NAME=Candlestick Pattern Foundation" in combined
          assert "S2B_CHART_STRUCTURE_DISPOSITION=REQUIRED_FOLLOW_ON_MODULE9_SLICE_BEFORE_REGIME" in combined
          for marker in ("EXCLUDED_FROM_V1_MINIMUM", "chart structures are excluded", "chart structure is excluded"):
              assert marker not in combined, marker
          assert "delayed confirmation is not lookahead" in combined.lower()

          # 3. exact finite pattern allowlist
          assert "S2B_PATTERN_ALLOWLIST=P-DC-001,P-MB-001,P-EC-001,P-EC-002,P-MS-001,P-ES-001" in combined
          assert "S2B_PATTERN_COUNT=6" in combined
          assert "S2B_PATTERN_FAMILIES=SINGLE_BAR,TWO_BAR_REVERSAL,THREE_BAR_REVERSAL" in combined
          for pattern_id in ("P-DC-001", "P-MB-001", "P-EC-001", "P-EC-002", "P-MS-001", "P-ES-001"):
              assert combined.count(pattern_id) >= 2, pattern_id

          # 4. explicit candle equations, polarity, thresholds and equality semantics
          semantics = (
              "S2B_CANDLE_RANGE=high-low",
              "S2B_CANDLE_BODY=abs(close-open)",
              "S2B_CANDLE_BODY_RATIO=body/range",
              "S2B_CANDLE_BULLISH=close>open",
              "S2B_CANDLE_BEARISH=close<open",
              "S2B_CANDLE_NEUTRAL=close==open",
              "S2B_CANDLE_ZERO_RANGE=VALIDITY_UNKNOWN_MATCH_INDETERMINATE",
              "S2B_SMALL_BODY_MAX=0.10",
              "S2B_LONG_BODY_MIN=0.90",
              "S2B_COMPARISON=DECIMAL_FEATURE_DECIMAL_V1_ONLY",
              "S2B_PATTERN_DECIMAL_POLICY=FEATURE_DECIMAL_V1",
              "S2B_PATTERN_BINARY_FLOAT=FORBIDDEN",
              "S2B_MIDPOINT_EQUALITY=BOUNDS_INCLUSIVE",
              "S2B_STAR_GAP_POLICY=NONE_IN_V1",
              "body_ratio <= 0.10",
              "body_ratio >= 0.90",
              "current.open <= previous.close",
              "current.close >= previous.open",
              "current.open >= previous.close",
              "current.close <= previous.open",
              "midpoint(bar1.open, bar1.close)",
              "S2B_TIMEFRAME_ALLOWLIST=Min1,Min5,Min15",
              "S2B_TIMEFRAME_IDENTITY=Min1:60:1:UNIX_EPOCH_MULTIPLES;Min5:300:1:UNIX_EPOCH_MULTIPLES;Min15:900:1:UNIX_EPOCH_MULTIPLES",
              "S2B_TIMEFRAME_IDENTITY_MATERIAL=TRUE",
              "`Min1` | `60` | `1` | `UNIX_EPOCH_MULTIPLES`",
              "`Min5` | `300` | `1` | `UNIX_EPOCH_MULTIPLES`",
              "`Min15` | `900` | `1` | `UNIX_EPOCH_MULTIPLES`",
              "S2B_AUTHORITY_SEAM=EVALUATOR_ISSUED_FEATURE_SAMPLE_FROM_CANDLE_AND_FEATURE_AUTHORITY_EVIDENCE",
              "S2B_PER_CONSTITUENT_AUTHORITY=EXACTLY_ONE_INDEPENDENTLY_ATTESTED_BINDING_PER_CONSTITUENT",
              "S2B_CONSTITUENT_CONTIGUITY=left.end==right.start",
              "S2B_AXIS_FOLD=EXISTING_S2A_MOST_RESTRICTIVE",
              "S2B_FIXTURE_SCOPE=REPLAY_ONLY",
              "S2B_WINDOW_START=FIRST_ORDERED_CONSTITUENT_INTERVAL_START",
              "S2B_WINDOW_END=FINAL_ORDERED_CONSTITUENT_INTERVAL_END",
              "S2B_EVENT_TIME=MAX_CONSTITUENT_EVENT_TIME",
              "S2B_KNOWLEDGE_TIME=MAX_CONSTITUENT_KNOWLEDGE_TIME",
              "S2B_WALL_RECEIVE_TIME=MAX_CONSTITUENT_WALL_RECEIVE_TIME",
              "S2B_PRE_BOUNDARY_RULE=MATCHED_FORBIDDEN_BEFORE_FINAL_CLOSED_BAR_AND_ALL_KNOWLEDGE_TIMES",
              "S2B_FROZEN_PACKAGE_COUNT=17",
              "S2B_CONSTITUENT_PAIR=EXACT_CANDLEBAR_PLUS_EVALUATOR_ISSUED_FEATURE_SAMPLE_FROM_SAME_CANDLE",
              "S2B_PAIR_OPEN_SOURCE=CANDLEBAR_OPEN",
              "S2B_PAIR_AUTHORITY_SOURCE=EVALUATOR_ISSUED_FEATURE_SAMPLE",
              "S2B_PAIR_FINGERPRINT_EQUALITY=sample.fingerprint==candle.fingerprint",
              "S2B_PAIR_OPEN_BINDING=CANDLEBAR_FINGERPRINT_COMMITS_OPEN",
              "sample.fingerprint == candle.fingerprint",
              "sample.source_id == candle.context.source_id",
              "sample.contract_id == candle.context.contract_id",
              "sample.environment == candle.context.environment",
              "sample.generation_fingerprint == candle.context.generation.fingerprint",
              "sample.timeframe.fingerprint == candle.timeframe.fingerprint",
              "sample.interval_start == candle.start",
              "sample.closed == (candle.finality == CLOSED)",
              "sample.quantity == candle.volume",
              "supplies the authoritative OHLC, including `open`",
              "consumed only from the exact `CandleBar` whose fingerprint equals",
              "left.candle.end == right.candle.start",
              "docs/14-product-module-map.md",
              "docs/91-r11-integrated-authority-state-dependency-architecture.md",
              "docs/105-r12-freeze-approval-and-checkpoint-promotion.md",
              "FeatureSample.from_candle",
              "FeatureAuthorityEvidence",
              "most-restrictive",
          )
          for marker in semantics:
              assert marker in combined, marker

          # 5. match separation from validity, no-lookahead and axis separation
          for marker in (
              "S2B_PATTERN_MATCH_STATE=MATCHED,NOT_MATCHED,INDETERMINATE",
              "S2B_MATCH_VALIDITY_RULE=VALID_OR_DEGRADED_REQUIRES_MATCHED_OR_NOT_MATCHED",
              "S2B_RESTRICTIVE_VALIDITY_RULE=WARMUP_UNKNOWN_INVALID_REQUIRES_INDETERMINATE",
              "S2B_VALID_NON_MATCH=NOT_MATCHED_NEVER_UNKNOWN",
              "S2B_NO_LOOKAHEAD=STRICT_ONE_STEP_BEFORE_FORMATION_BOUNDARY_NOT_RECOGNIZED",
              "S2B_AXIS_SEPARATION=FeatureValidity;MarketStateTrust;DataAuthority;ResourceRestriction;UniverseLifecycleRestriction",
              "PatternMatchState",
          ):
              assert marker in combined, marker

          # 6. proof obligations and rollback semantics
          for marker in (
              "S2B-PO-01", "S2B-PO-09", "S2B-PO-10", "S2B-PO-11", "S2B-PO-12", "S2B-PO-13",
              "negative-valid", "boundary-equality", "zero-range", "timeframe-rejection", "rollback",
              "wrong duration", "non-canonical alignment",
              "forged or mutated `open`", "unpaired raw `CandleBar`", "unpaired `FeatureSample`",
              "different `CandleBar` fails",
          ):
              assert marker in combined, marker

          # 7. canonical markers must be consistent across all three documents
          shared = (
              "S2B_PATTERN_ALLOWLIST=P-DC-001,P-MB-001,P-EC-001,P-EC-002,P-MS-001,P-ES-001",
              "S2B_PATTERN_COUNT=6",
              "S2B_NO_LOOKAHEAD=STRICT_ONE_STEP_BEFORE_FORMATION_BOUNDARY_NOT_RECOGNIZED",
              "S2B_PATTERN_DECIMAL_POLICY=FEATURE_DECIMAL_V1",
              "S2B_AXIS_SEPARATION=FeatureValidity;MarketStateTrust;DataAuthority;ResourceRestriction;UniverseLifecycleRestriction",
              "S2B_CHART_STRUCTURE_DISPOSITION=REQUIRED_FOLLOW_ON_MODULE9_SLICE_BEFORE_REGIME",
              "S2B_TIMEFRAME_ALLOWLIST=Min1,Min5,Min15",
              "S2B_PATTERN_MATCH_STATE=MATCHED,NOT_MATCHED,INDETERMINATE",
              "S2B_FROZEN_BASELINE=" + baseline,
              "S2B_DOD_SECTIONS=2,4,5,11",
              "S2B_TIMEFRAME_IDENTITY=Min1:60:1:UNIX_EPOCH_MULTIPLES;Min5:300:1:UNIX_EPOCH_MULTIPLES;Min15:900:1:UNIX_EPOCH_MULTIPLES",
              "S2B_AUTHORITY_SEAM=EVALUATOR_ISSUED_FEATURE_SAMPLE_FROM_CANDLE_AND_FEATURE_AUTHORITY_EVIDENCE",
              "S2B_PER_CONSTITUENT_AUTHORITY=EXACTLY_ONE_INDEPENDENTLY_ATTESTED_BINDING_PER_CONSTITUENT",
              "S2B_CONSTITUENT_CONTIGUITY=left.end==right.start",
              "S2B_AXIS_FOLD=EXISTING_S2A_MOST_RESTRICTIVE",
              "S2B_FIXTURE_SCOPE=REPLAY_ONLY",
              "S2B_WINDOW_START=FIRST_ORDERED_CONSTITUENT_INTERVAL_START",
              "S2B_WINDOW_END=FINAL_ORDERED_CONSTITUENT_INTERVAL_END",
              "S2B_EVENT_TIME=MAX_CONSTITUENT_EVENT_TIME",
              "S2B_KNOWLEDGE_TIME=MAX_CONSTITUENT_KNOWLEDGE_TIME",
              "S2B_WALL_RECEIVE_TIME=MAX_CONSTITUENT_WALL_RECEIVE_TIME",
              "S2B_PRE_BOUNDARY_RULE=MATCHED_FORBIDDEN_BEFORE_FINAL_CLOSED_BAR_AND_ALL_KNOWLEDGE_TIMES",
              "S2B_FROZEN_PACKAGE_COUNT=17",
              "S2B_CONSTITUENT_PAIR=EXACT_CANDLEBAR_PLUS_EVALUATOR_ISSUED_FEATURE_SAMPLE_FROM_SAME_CANDLE",
              "S2B_PAIR_OPEN_SOURCE=CANDLEBAR_OPEN",
              "S2B_PAIR_AUTHORITY_SOURCE=EVALUATOR_ISSUED_FEATURE_SAMPLE",
              "S2B_PAIR_FINGERPRINT_EQUALITY=sample.fingerprint==candle.fingerprint",
              "S2B_PAIR_OPEN_BINDING=CANDLEBAR_FINGERPRINT_COMMITS_OPEN",
          )
          for document in (candidate, authorization, implementation):
              for marker in shared:
                  assert marker in document, (marker, document[:48])

          assert "Status: `PENDING_INDEPENDENT_HIGH_ASSURANCE_REVIEW`" in candidate
          assert "Status: `PENDING_INDEPENDENT_HIGH_ASSURANCE_REVIEW`" in authorization
          assert "Status: `PENDING_SEPARATE_AUTHORIZATION_CHECKPOINT`" in implementation
          assert "AUTHOR_SIDE_GOVERNANCE_PREFLIGHT_NOT_INDEPENDENT_APPROVAL" in combined
          assert "INVALID/UNKNOWN" not in combined
          assert "WARMUP/UNKNOWN" not in combined

          # 8. no capability-creating construct; exclusion prose remains legitimate.
          for forbidden in (
              "http://", "https://", "wss://", "ws://",
              "accesskey", "apikey", "secretkey", "private_key",
          ):
              assert forbidden.lower() not in combined.lower(), forbidden
          for affirmative in (
              "implementation_authorized=true", "production_credentials_authorized=true",
              "production_deployment_authorized=true", "limited_live_authorized=true",
              "live_trading_authorized=true", "authorized to trade", "may place orders",
          ):
              assert affirmative not in combined, affirmative
          for required_false in (
              "implementation_authorized=false", "implementation_authorization_scope=[]",
              "implementation_authorization_ceiling=NONE_PENDING_NEXT_GOVERNED_AUTHORIZATION",
              "production_credentials_authorized=false", "production_deployment_authorized=false",
              "limited_live_authorized=false", "live_trading_authorized=false",
          ):
              assert required_false in combined, required_false

          manual_trigger = "workflow" + "_" + "dispatch"
          assert manual_trigger not in workflow
          assert "on:\n  pull_request:" in workflow
          print("Traceability, Module 9 scope integrity, candlestick semantics and match separation: PASS")
          PY

