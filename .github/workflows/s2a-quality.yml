name: HCT-IMP-0009-S2A Deterministic Feature Foundation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/backend/src/hct_backend/features.py"
      - "apps/backend/src/hct_backend/feature_engine.py"
      - "apps/backend/tests/test_features.py"
      - "scripts/scan_s2a_boundaries.py"
      - "scripts/benchmark_s2a.py"
      - "evidence/HCT-IMP-0009-S2A-CONTEXT-LOCK.md"
      - "evidence/HCT-IMP-0009-S2A.md"
      - ".github/workflows/s2a-quality.yml"

permissions:
  contents: read

env:
  EXECUTION_BASE_SHA: fecb97b6c9513a6dc0114d22c5e3768017411157
  CHECKPOINT_ID: HCT-CP-0033
  AUTHORIZATION_ID: HCT-IMPL-AUTH-0009
  IMPLEMENTATION_ID: HCT-IMP-0009-S2A

jobs:
  s2a-quality:
    name: s2a-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert exact pull request context and diff integrity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${{ github.event.pull_request.base.sha }}" = "${EXECUTION_BASE_SHA}"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "${EXECUTION_BASE_SHA}" HEAD
          git diff --check "${EXECUTION_BASE_SHA}...HEAD"
          echo "exactHead=$(git rev-parse HEAD)"
          echo "executionBase=${EXECUTION_BASE_SHA}"

      - name: Validate CP0033 authorization and fail-closed firewall
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          checkpoint = json.loads(Path("checkpoints/history/HCT-CP-0033.json").read_text())
          latest = json.loads(Path("checkpoints/workstreams/planning/latest.json").read_text())
          keys = (
              "checkpoint_id", "status", "authorization_id", "authorized_increment",
              "implementation_authorized", "implementation_authorization_scope",
              "implementation_authorization_ceiling", "production_credentials_authorized",
              "production_deployment_authorized", "limited_live_authorized", "live_trading_authorized",
          )
          for key in keys:
              assert checkpoint[key] == latest[key], key
          assert checkpoint["checkpoint_id"] == "HCT-CP-0033"
          assert checkpoint["status"] == "IMPLEMENTATION_AUTHORIZED_S2A"
          assert checkpoint["authorization_id"] == "HCT-IMPL-AUTH-0009"
          assert checkpoint["authorized_increment"] == "HCT-IMP-0009-S2A"
          assert checkpoint["implementation_authorized"] is True
          assert checkpoint["implementation_authorization_scope"] == ["HCT-IMP-0009-S2A"]
          assert checkpoint["implementation_authorization_ceiling"] == "NON_TRADING_STAGE_2_DETERMINISTIC_FEATURE_INDICATOR_FOUNDATION_ONLY"
          for field in (
              "production_credentials_authorized", "production_deployment_authorized",
              "limited_live_authorized", "live_trading_authorized",
          ):
              assert checkpoint[field] is False, field
          print("CP0033 implementation scope and production/live firewall: PASS")
          PY

      - name: Validate exact changed-file boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "${EXECUTION_BASE_SHA}...HEAD" | sort)
          allowed='^(\.github/workflows/s2a-quality\.yml|apps/backend/src/hct_backend/(features|feature_engine)\.py|apps/backend/tests/test_features\.py|scripts/(scan_s2a_boundaries|benchmark_s2a)\.py|evidence/HCT-IMP-0009-S2A(-CONTEXT-LOCK)?\.md)$'
          invalid=()
          for path in "${changed[@]}"; do
            if ! [[ "${path}" =~ ${allowed} ]]; then invalid+=("${path}"); fi
          done
          if [ "${#invalid[@]}" -ne 0 ]; then
            printf '%s\n' "${invalid[@]}"
            exit 1
          fi
          if printf '%s\n' "${changed[@]}" | grep -Eq '^(docs/|checkpoints/|work-orders/|adr/|apps/frontend/|packages/contracts/|apps/backend/pyproject.toml|apps/backend/uv.lock)'; then
            echo "Frozen governance, dependency, contract, frontend or upstream source surface changed."
            exit 1
          fi
          echo "S2A changed-file boundary: PASS"

      - name: Validate frozen source identities and CP0033 handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          expected = {
              "docs/02-requirements.md": "292da9552ae816e4d51b8a299456305da1658e55",
              "docs/48-r04-execution-requirements-addendum.md": "f20c1ed00bdb13801aaff8a3b648371bfcffba58",
              "docs/54-r05-realtime-requirements-addendum.md": "636ad01da9c25e760dd5e2f033b93a0f04578a17",
              "docs/61-r06-intelligence-requirements-addendum.md": "fea197e60532eb6ff3b11b628b9aabcbcfc00c41",
              "docs/67-r07-validation-laboratory-requirements-addendum.md": "c8a426966c5a0dc34704d1413f506332e770c2c7",
              "docs/73-r08-multitenant-security-requirements-addendum.md": "c859c0c4a718e3017c34aa50013d4c50959853b4",
              "docs/80-r09-cockpit-uiux-requirements-addendum.md": "bc897ebd470857a53055bdee85128b5bd31a5822",
              "docs/87-r10-observability-audit-incident-finops-requirements-addendum.md": "023187ef23b01d5a11f978bbfe6e38abf172bb3b",
              "docs/93-r11-integration-requirements-addendum.md": "6935e9973696d5b706546d63d847ea398780d936",
              "docs/06-test-benchmark-plan.md": "29401ce8fe1616f9390a317bae62d3a157addaa5",
          }
          base = os.environ["EXECUTION_BASE_SHA"]
          for path, digest in expected.items():
              actual = subprocess.check_output(["git", "rev-parse", f"{base}:{path}"], text=True).strip()
              assert actual == digest, (path, actual, digest)
          assert subprocess.check_output(["git", "rev-parse", "HEAD:evidence/HCT-IMP-0009-S2A-CONTEXT-LOCK.md"], text=True).strip()
          print("Frozen requirement identities and CP0033 handoff: PASS")
          PY

      - name: Validate implementation contract and negative scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("apps/backend/src/hct_backend/features.py").read_text()
          work_order = Path("work-orders/HCT-IMP-0009-S2A.md").read_text()
          evidence = Path("evidence/HCT-IMP-0009-S2A.md").read_text()
          required = (
              "F-RET-001", "F-SMA-001", "F-EMA-001", "F-ROC-001", "F-RSI-001", "F-TR-001", "F-ATR-001", "F-VSMA-001",
              "FEATURE_DECIMAL_V1", "ROUND_HALF_EVEN", "FeatureValidity", "UNKNOWN", "INVALID", "WARMUP", "DEGRADED",
              "market_state_fingerprint", "generation_fingerprint", "knowledge_time", "DERIVED_ANALYTICAL_V1",
              "RECURSIVE_STATE_VERSION", "align_closed_1m_candles",
          )
          for marker in required:
              assert marker in source, marker
          for marker in ("PO-F01", "PO-F02", "PO-F03", "PO-F04", "PO-F05", "PO-F06", "PO-F07", "PO-F08", "PO-F09", "PO-F10"):
              assert marker in evidence, marker
          for forbidden in ("http://", "https://", "socket", "websocket", "requests", "httpx", "credential", "private API", "database", "deployment", "real-money"):
              assert forbidden.lower() not in source.lower(), forbidden
          assert "Status: `AUTHOR_PREFLIGHT`" in evidence
          assert "NOT_INDEPENDENT_APPROVAL" in evidence
          assert "production_credentials_authorized=false" in evidence
          assert "production_deployment_authorized=false" in evidence
          assert "limited_live_authorized=false" in evidence
          assert "live_trading_authorized=false" in evidence
          print("S2A feature contract, proof-obligation evidence and negative scope: PASS")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.13
          uv sync --project apps/backend --locked --all-groups

      - name: Run S0A-S1F backend regressions and S2A static gates
        run: |
          uv run --project apps/backend pytest --cov=hct_backend --cov-report=term-missing --cov-fail-under=90 apps/backend/tests
          uv run --project apps/backend ruff check apps/backend/src/hct_backend/features.py apps/backend/src/hct_backend/feature_engine.py apps/backend/tests/test_features.py scripts/scan_s2a_boundaries.py scripts/benchmark_s2a.py
          uv run --project apps/backend ruff format --check apps/backend/src/hct_backend/features.py apps/backend/src/hct_backend/feature_engine.py apps/backend/tests/test_features.py scripts/scan_s2a_boundaries.py scripts/benchmark_s2a.py
          uv run --project apps/backend mypy apps/backend/src
          uv build --project apps/backend --out-dir "$RUNNER_TEMP/hct-backend-dist-s2a"
          uv run --project apps/backend --with pip-audit==2.10.1 pip-audit --local

      - name: Run S2A negative capability and deterministic benchmark gates
        shell: bash
        run: |
          set -euo pipefail
          uv run --project apps/backend python scripts/scan_s2a_boundaries.py
          uv run --project apps/backend python scripts/benchmark_s2a.py --profile all --output "$RUNNER_TEMP/benchmarks-s2a-a.json"
          uv run --project apps/backend python scripts/benchmark_s2a.py --profile all --output "$RUNNER_TEMP/benchmarks-s2a-b.json"
          uv run --project apps/backend python scripts/benchmark_s2a.py --validate "$RUNNER_TEMP/benchmarks-s2a-a.json" "$RUNNER_TEMP/benchmarks-s2a-b.json"

      - name: Run frontend prior-stage regression gates
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Validate frontend without product mutation
        working-directory: apps/frontend
        run: |
          npm ci
          npm run typecheck
          npm test -- --run
          npm run lint
          npm exec -- prettier --check src/generated/contracts.ts
          npm run build
          npm audit --audit-level=high --omit=optional

      - name: Publish exact-head implementation summary
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          summary="${RUNNER_TEMP}/s2a-summary.md"
          : > "${summary}"
          printf -- '%s\n' '## HCT-IMP-0009-S2A exact-head evidence' >> "${summary}"
          printf -- '- head: `%s`\n' "${HEAD_SHA}" >> "${summary}"
          printf -- '- base: `%s`\n' "${EXECUTION_BASE_SHA}" >> "${summary}"
          printf -- '- checkpoint: `%s`\n' "${CHECKPOINT_ID}" >> "${summary}"
          printf -- '- implementation: `%s`\n' "${IMPLEMENTATION_ID}" >> "${summary}"
          printf -- '- %s\n' 'implementation_authorized: true (bounded non-trading ceiling)' >> "${summary}"
          printf -- '- %s\n' 'production_credentials_authorized: false' >> "${summary}"
          printf -- '- %s\n' 'production_deployment_authorized: false' >> "${summary}"
          printf -- '- %s\n' 'limited_live_authorized: false' >> "${summary}"
          printf -- '- %s\n' 'live_trading_authorized: false' >> "${summary}"
          grep -Fq -- "${HEAD_SHA}" "${summary}"
          grep -Fq -- "${EXECUTION_BASE_SHA}" "${summary}"
          grep -Fq -- "${CHECKPOINT_ID}" "${summary}"
          grep -Fq -- "${IMPLEMENTATION_ID}" "${summary}"
          test "$(grep -Fc -- "${HEAD_SHA}" "${summary}")" -ge 1
          test "$(grep -Fc -- "${EXECUTION_BASE_SHA}" "${summary}")" -ge 1
          test "$(grep -Fc -- "${CHECKPOINT_ID}" "${summary}")" -ge 1
          test "$(grep -Fc -- "${IMPLEMENTATION_ID}" "${summary}")" -ge 1
          cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Exact-head summary material verified for head/base/checkpoint/implementation: PASS"
