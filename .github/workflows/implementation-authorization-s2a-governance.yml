name: HCT-IMPL-AUTH-0009 S2A Authorization Governance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  CANONICAL_BASE_SHA: 625dd0c145087038bdbccd665548d811e187194c
  CANDIDATE_AUTHORIZATION_ID: HCT-IMPL-AUTH-0009
  CANDIDATE_IMPLEMENTATION_ID: HCT-IMP-0009-S2A

jobs:
  s2a-authorization-governance:
    name: s2a-authorization-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert pull-request-only exact head, base and canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "pull_request"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${{ github.event.pull_request.base.sha }}" = "${CANONICAL_BASE_SHA}"
          test "${{ github.event.pull_request.head.sha }}" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${CANONICAL_BASE_SHA}"

      - name: Validate CP0030 fail-closed authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          latest = json.loads(Path("checkpoints/workstreams/planning/latest.json").read_text())
          checkpoint = json.loads(Path("checkpoints/history/HCT-CP-0030.json").read_text())
          for state in (latest, checkpoint):
              assert state["checkpoint_id"] == "HCT-CP-0030"
              assert state["status"] == "S1E_IMPLEMENTATION_APPROVED_MERGED"
              assert state["implementation_authorized"] is False
              assert state["implementation_authorization_scope"] == []
              assert state["implementation_authorization_ceiling"] == "NONE_PENDING_NEXT_GOVERNED_AUTHORIZATION"
              for key in ("production_credentials_authorized", "production_deployment_authorized", "limited_live_authorized", "live_trading_authorized"):
                  assert state[key] is False, key
          print("CP0030 fail-closed authority: PASS")
          PY

      - name: Validate exact governance-only changed-file allowlist
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t actual < <(git diff --name-only "${CANONICAL_BASE_SHA}...${{ github.event.pull_request.head.sha }}" | sort)
          expected=(
            ".github/workflows/implementation-authorization-s2a-governance.yml"
            "docs/130-implementation-authorization-s2a-candidate.md"
            "work-orders/HCT-IMPL-AUTH-0009.md"
            "work-orders/HCT-IMP-0009-S2A.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#actual[@]}" -eq "${#expected_sorted[@]}"
          for index in "${!expected_sorted[@]}"; do test "${actual[$index]}" = "${expected_sorted[$index]}"; done
          git diff --check "${CANONICAL_BASE_SHA}...${{ github.event.pull_request.head.sha }}"

      - name: Validate candidate sections, traceability and negative scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          candidate = Path("docs/130-implementation-authorization-s2a-candidate.md").read_text()
          authorization = Path("work-orders/HCT-IMPL-AUTH-0009.md").read_text()
          implementation = Path("work-orders/HCT-IMP-0009-S2A.md").read_text()
          workflow = Path(".github/workflows/implementation-authorization-s2a-governance.yml").read_text()
          for text in (candidate, authorization, implementation):
              for section in ("OBJECTIVE", "CONTEXT", "SCOPE", "OUT OF SCOPE", "REQUIREMENTS", "ARCHITECTURE RULES", "CONSTRAINTS", "ACCEPTANCE CRITERIA", "TESTS", "DELIVERABLES", "REVIEW FORMAT", "STOP CONDITION"):
                  assert f"## {section}" in text or f"### {section}" in text, section
          for section in ("SOURCE LOCK", "FILES/SOURCES TO READ"):
              assert section in authorization or section in implementation, section
          for marker in (
              "HCT-IMPL-AUTH-0009", "HCT-IMP-0009-S2A", "HCT-CP-0030", CANONICAL_BASE_SHA,
              "Module 8", "Module 9", "V1_CORE", "V1_MINIMUM", "features/indicators/patterns",
              "HCT-IMP-0008-S1E", "Market-State", "DataAuthority", "read-only", "no-lookahead",
              "event time", "knowledge time", "WARMUP", "UNKNOWN", "INVALID", "DEGRADED",
              "PO-F01", "PO-F10", "LIVE", "PAPER", "SHADOW", "REPLAY",
              "implementation_authorized=false", "production_credentials_authorized=false",
              "production_deployment_authorized=false", "limited_live_authorized=false", "live_trading_authorized=false",
              "R05::Time and freshness requirements::B1", "R05::State coherency requirements::B1",
              "R05::Candle/cache/replay requirements::B1", "INT-002", "INT-012", "INT-018",
              "VAL-003", "VAL-005", "R11-REQ-006", "R11-REQ-014", "HCT-DEC-0061", "HCT-DEC-0065",
              "ADR-0049", "negative-capability", "governance-only",
          ):
              assert marker in candidate + authorization + implementation, marker
          for forbidden in ("socket", "WebSocket", "credential", "private API", "database", "deployment", "live trading"):
              assert forbidden.lower() in (candidate + authorization + implementation).lower(), forbidden
          manual_trigger = "workflow" + "_" + "dispatch"
          assert manual_trigger not in workflow
          print("Candidate sections, traceability, dependency binding and negative scope: PASS")
          PY

      - name: Publish S2A authorization governance summary
        shell: bash
        run: |
          echo "candidateAuthorizationId=${CANDIDATE_AUTHORIZATION_ID}"
          echo "candidateImplementationId=${CANDIDATE_IMPLEMENTATION_ID}"
          echo "canonicalBase=${CANONICAL_BASE_SHA}"
          echo "governanceOnlyDiff=PASS"
          echo "checkpointFailClosed=PASS"
          echo "upstreamMarketTruthReadOnly=PASS"
          echo "noLookaheadContract=PASS"
          echo "productImplementation=FORBIDDEN"
          echo "productionCredentials=false"
          echo "productionDeployment=false"
          echo "limitedLive=false"
          echo "liveTrading=false"
