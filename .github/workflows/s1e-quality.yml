name: HCT-IMP-0008-S1E Market Truth Foundation

on:
  pull_request:
    branches: [main]
    paths:
      - "adr/HCT-ADR-0049-s1e-market-truth-foundation.md"
      - "apps/backend/src/hct_backend/market_truth.py"
      - "apps/backend/tests/test_market_truth.py"
      - "apps/backend/tests/test_scan_s1e_boundaries.py"
      - "scripts/scan_s1e_boundaries.py"
      - "evidence/HCT-IMP-0008-S1E.md"
      - ".github/workflows/s1e-quality.yml"

permissions:
  contents: read

env:
  AUTHORIZED_BASE_SHA: 2662f81dafb848724bfba0d2f445b03f0c96b959

jobs:
  s1e-quality:
    name: s1e-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert pull-request-only exact head and authorized base
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "pull_request"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "$AUTHORIZED_BASE_SHA"
          test "$(git rev-parse origin/main)" = "$AUTHORIZED_BASE_SHA"
          git cat-file -e "$AUTHORIZED_BASE_SHA^{commit}"
          if grep -Eq '^[[:space:]]*workflow_dispatch:' .github/workflows/s1e-quality.yml; then
            echo 'S1E receipt must not expose a manual-dispatch success path.'
            exit 1
          fi

      - name: Validate CP0029 context lock and authorization firewall
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"checkpoint_id": "HCT-CP-0029"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"status": "IMPLEMENTATION_AUTHORIZED_S1E"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"authorized_implementation_slice": "HCT-IMP-0008-S1E"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"implementation_authorized": true' checkpoints/workstreams/planning/latest.json
          grep -Fq '"implementation_authorization_ceiling": "NON_TRADING_STAGE_1_MARKET_TRUTH_FOUNDATION_ONLY"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"production_credentials_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"production_deployment_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"limited_live_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"live_trading_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq 'HCT-CP-0029' docs/11-checkpoint.md
          grep -Fq 'HCT-IMP-0008-S1E' work-orders/HCT-IMP-0008-S1E.md

      - name: Validate candidate changed-file boundary
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$AUTHORIZED_BASE_SHA...HEAD")"
          printf '%s\n' "$changed"
          invalid="$(printf '%s\n' "$changed" | grep -Ev '^(adr/HCT-ADR-0049-s1e-market-truth-foundation\.md|apps/backend/src/hct_backend/market_truth\.py|apps/backend/tests/test_market_truth\.py|apps/backend/tests/test_scan_s1e_boundaries\.py|scripts/scan_s1e_boundaries\.py|evidence/HCT-IMP-0008-S1E\.md|\.github/workflows/s1e-quality\.yml)$' || true)"
          if [ -n "$invalid" ]; then
            echo 'S1E changed files leave the authorized implementation boundary:'
            echo "$invalid"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(checkpoints/|docs/|work-orders/|apps/backend/uv\.lock$)'; then
            echo 'Frozen, checkpoint, Work Order or dependency-lock surface changed by S1E.'
            exit 1
          fi
          test "$(git merge-base "$AUTHORIZED_BASE_SHA" HEAD)" = "$AUTHORIZED_BASE_SHA"
          git diff --check "$AUTHORIZED_BASE_SHA...HEAD"

      - name: Install locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.13
          uv sync --project apps/backend --locked --all-groups

      - name: Validate backend, contracts, static analysis, build and audit
        run: |
          uv run --project apps/backend python scripts/generate_contracts.py --check
          uv run --project apps/backend python scripts/validate_contract_parity.py
          uv run --project apps/backend pytest --cov=hct_backend --cov-report=term-missing --cov-fail-under=90 apps/backend/tests
          uv run --project apps/backend ruff check apps/backend/src apps/backend/tests scripts/scan_s1e_boundaries.py scripts/validate_contract_parity.py
          uv run --project apps/backend ruff format --check apps/backend/src/hct_backend/market_truth.py apps/backend/tests/test_market_truth.py apps/backend/tests/test_scan_s1e_boundaries.py scripts/scan_s1e_boundaries.py
          uv run --project apps/backend mypy apps/backend/src
          uv build --project apps/backend --out-dir /tmp/hct-backend-dist-s1e
          uv run --project apps/backend --with pip-audit==2.10.1 pip-audit --local

      - name: Run prior-stage regressions and S1E boundary gates
        env:
          BASE_SHA: ${{ env.AUTHORIZED_BASE_SHA }}
        run: |
          uv run --project apps/backend python scripts/scan_s1e_boundaries.py
          uv run --project apps/backend pytest \
            apps/backend/tests/test_contracts.py \
            apps/backend/tests/test_security.py \
            apps/backend/tests/test_provenance.py \
            apps/backend/tests/test_scan_s0b_boundaries.py \
            apps/backend/tests/test_scan_s0c_boundaries.py \
            apps/backend/tests/test_exchange_reference.py \
            apps/backend/tests/test_scan_s1a_boundaries.py \
            apps/backend/tests/test_mexc_reference.py \
            apps/backend/tests/test_market_universe.py \
            apps/backend/tests/test_scan_s1c_boundaries.py \
            apps/backend/tests/test_quota_governor.py \
            apps/backend/tests/test_scan_s1d_boundaries.py \
            apps/backend/tests/test_market_truth.py \
            apps/backend/tests/test_scan_s1e_boundaries.py

      - name: Install and validate frontend regression surface
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Run frontend typecheck, tests, lint, generated format, build and audit
        working-directory: apps/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run lint
          npm exec -- prettier --check src/generated/contracts.ts
          npm run build
          npm audit --audit-level=high --omit=optional

      - name: Publish S1E governance summary
        run: |
          echo 's1e-quality is a pull_request-only exact raw-head receipt.'
          echo 'Bounded subject: non-trading Market Truth Foundation only.'
          echo 'No credentials, private state, orders, persistence, deployment, limited-live or live-trading authority is authorized.'
