name: R12 Planning Freeze Governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/r12-planning-freeze-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: planning-freeze-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R12 candidate package
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/00-source-hierarchy.md
            docs/09-definition-of-done.md
            docs/98-r12-planning-freeze-gap-audit.md
            docs/99-r12-frozen-requirements-baseline.md
            docs/100-r12-requirements-traceability-and-no-loss-proof.md
            docs/101-r12-freeze-governance-change-control-and-deferred-decisions.md
            docs/102-r12-freeze-acceptance-matrix.md
            docs/103-r12-final-planning-freeze-audit.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Verify fail-closed authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          audit=docs/103-r12-final-planning-freeze-audit.md
          for flag in \
            implementation_authorized=false \
            production_credentials_authorized=false \
            production_deployment_authorized=false \
            limited_live_authorized=false \
            live_trading_authorized=false; do
            grep -Fq "$flag" "$audit" || { echo "Required fail-closed flag missing: $flag"; exit 1; }
          done

      - name: Verify planning-only diff boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          invalid="$(printf '%s\n' "$changed" | grep -Ev '^(docs/|\.github/workflows/r12-planning-freeze-governance\.yml$)' || true)"
          if [ -n "$invalid" ]; then
            echo 'R12 Planning Freeze PR contains changes outside the approved planning/governance boundary:'
            echo "$invalid"
            exit 1
          fi

      - name: Verify freeze review markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'READY_FOR_INDEPENDENT_HIGH_ASSURANCE_REVIEW' docs/103-r12-final-planning-freeze-audit.md
          grep -Fq 'INDEPENDENT_REVIEW_REQUIRED' docs/103-r12-final-planning-freeze-audit.md
          grep -Fq 'HCT-REQ-BASELINE-V1-CANDIDATE' docs/99-r12-frozen-requirements-baseline.md

      - name: Governance check summary
        run: |
          echo 'R12 candidate package exists, authorization remains fail-closed, and diff stays within planning/governance scope.'
