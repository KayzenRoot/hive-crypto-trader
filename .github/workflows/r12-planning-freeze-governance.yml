name: R12 Planning Freeze Governance

# R12 is already independently approved, merged and checkpoint-promoted as
# HCT-CP-0014 / PLANNING_FREEZE_APPROVED. Keep this workflow available for
# explicit historical/manual revalidation only; later implementation-phase PRs
# use their own phase-specific governance checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: planning-freeze-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify R12 promoted package
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/00-source-hierarchy.md
            docs/09-definition-of-done.md
            docs/98-r12-planning-freeze-gap-audit.md
            docs/99-r12-frozen-requirements-baseline.md
            docs/100-r12-requirements-traceability-and-no-loss-proof.md
            docs/101-r12-freeze-governance-change-control-and-deferred-decisions.md
            docs/102-r12-freeze-acceptance-matrix.md
            docs/103-r12-final-planning-freeze-audit.md
            docs/105-r12-freeze-approval-and-checkpoint-promotion.md
            checkpoints/history/HCT-CP-0014.json
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty R12 promoted artifact: $file"; exit 1; }
          done

      - name: Verify current checkpoint records freeze approval
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PLANNING_FREEZE_APPROVED' docs/11-checkpoint.md
          grep -Fq 'HCT-CP-0014' docs/11-checkpoint.md
          grep -Fq '"status": "PLANNING_FREEZE_APPROVED"' checkpoints/workstreams/planning/latest.json

      - name: Verify higher operational gates remain fail-closed at freeze checkpoint
        shell: bash
        run: |
          set -euo pipefail
          cp=checkpoints/history/HCT-CP-0014.json
          for flag in \
            '"implementation_authorized": false' \
            '"production_credentials_authorized": false' \
            '"production_deployment_authorized": false' \
            '"limited_live_authorized": false' \
            '"live_trading_authorized": false'; do
            grep -Fq "$flag" "$cp" || { echo "Expected freeze-checkpoint flag missing: $flag"; exit 1; }
          done

      - name: Governance summary
        run: |
          echo 'Historical R12 promoted state is internally present. This manual workflow does not authorize implementation or any live stage.'
