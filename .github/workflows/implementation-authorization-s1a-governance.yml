name: HCT-IMPL-AUTH-0004 S1A Authorization Governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/115-implementation-authorization-s1a-candidate.md'
      - 'work-orders/HCT-IMPL-AUTH-0004.md'
      - 'work-orders/HCT-IMP-0004-S1A.md'
      - '.github/workflows/implementation-authorization-s1a-governance.yml'

permissions:
  contents: read

env:
  AUTHORIZED_BASE_SHA: aa2aea7e6bf9b148c6c212f454eb0e5c0db772e5

jobs:
  implementation-authorization-s1a-governance:
    name: implementation-authorization-s1a-governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert pull-request-only exact raw head and authorized base
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event_name }}" = "pull_request"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "$AUTHORIZED_BASE_SHA"
          git cat-file -e "$AUTHORIZED_BASE_SHA^{commit}"
          if grep -Fq 'workflow_dispatch' .github/workflows/implementation-authorization-s1a-governance.yml; then
            echo 'Authorization receipt must not expose a manual-dispatch success path.'
            exit 1
          fi

      - name: Verify CP0020 canonical fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"checkpoint_id": "HCT-CP-0020"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"status": "S0C_IMPLEMENTATION_APPROVED_MERGED"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"implementation_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"implementation_authorization_scope": []' checkpoints/workstreams/planning/latest.json
          grep -Fq '"implementation_authorization_ceiling": "NONE_PENDING_NEXT_GOVERNED_AUTHORIZATION"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"production_credentials_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"production_deployment_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"limited_live_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"live_trading_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq 'HCT-CP-0020' docs/11-checkpoint.md
          grep -Fq 'Current implementation authorization: `CLOSED_FAIL_CLOSED`' docs/11-checkpoint.md

      - name: Verify frozen source identity and dependency order
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/02-requirements.md)" = "292da9552ae816e4d51b8a299456305da1658e55"
          test "$(git hash-object docs/54-r05-realtime-requirements-addendum.md)" = "636ad01da9c25e760dd5e2f033b93a0f04578a17"
          test "$(git hash-object docs/93-r11-integration-requirements-addendum.md)" = "6935e9973696d5b706546d63d847ea398780d936"
          grep -Fq '## HCT-DEC-0023 — V1 is MEXC-only live trading but core architecture is multi-exchange-ready' docs/10-decisions-ledger.md
          grep -Fq '### Stage 1 — Exchange and realtime truth' docs/91-r11-integrated-authority-state-dependency-architecture.md
          grep -Fq -- '- Exchange Abstraction + MEXC adapter;' docs/91-r11-integrated-authority-state-dependency-architecture.md
          grep -Fq 'Core HCT modules depend on a canonical exchange interface, not directly on MEXC request/response models.' docs/23-multi-exchange-adapter-architecture.md
          grep -Fq 'HCT Core -> Exchange Capability Interface -> Exchange Adapter -> MEXC/Binance/Future Exchange' docs/23-multi-exchange-adapter-architecture.md

      - name: Verify authorization candidate package
        shell: bash
        run: |
          set -euo pipefail
          required=(
            docs/115-implementation-authorization-s1a-candidate.md
            work-orders/HCT-IMPL-AUTH-0004.md
            work-orders/HCT-IMP-0004-S1A.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Verify bounded pre-authorization semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Status: `INDEPENDENT_REVIEW_REQUIRED`' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'Status: `PENDING_INDEPENDENT_REVIEW`' work-orders/HCT-IMPL-AUTH-0004.md
          grep -Fq 'Status: `PENDING_AUTHORIZATION`' work-orders/HCT-IMP-0004-S1A.md
          grep -Fq 'HCT-IMP-0004-S1A' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'NON_TRADING_STAGE_1_EXCHANGE_ABSTRACTION_CAPABILITY_CONTRACT_FOUNDATION_ONLY' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'Do not begin product implementation from this document.' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'S0A, S0B and S0C are independently approved and merged.' docs/115-implementation-authorization-s1a-candidate.md

      - name: Verify exact requirement and decision locators
        shell: bash
        run: |
          set -euo pipefail
          locators=(
            'REQ02::Market and exchange requirements::B2'
            'REQ02::Market and exchange requirements::B5'
            'REQ02::Market and exchange requirements::B7'
            'REQ02::Market and exchange requirements::B8'
            'REQ02::Market and exchange requirements::B9'
            'R11-REQ-006'
            'R11-REQ-012'
            'R11-REQ-013'
            'R11-REQ-014'
            'R11-REQ-024'
            'HCT-DEC-0023'
          )
          for locator in "${locators[@]}"; do
            grep -Fq "$locator" docs/115-implementation-authorization-s1a-candidate.md
            grep -Fq "$locator" work-orders/HCT-IMP-0004-S1A.md
          done

      - name: Verify higher-risk gates remain closed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'production_credentials_authorized=false' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'production_deployment_authorized=false' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'limited_live_authorized=false' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'live_trading_authorized=false' docs/115-implementation-authorization-s1a-candidate.md

      - name: Verify prohibited capability boundary is explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'MEXC REST/WebSocket/SDK/network connectivity' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'authentication, request signing' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'public realtime market-data ingest' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'order placement, cancel/replace' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'production deployment' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'limited-live or real-money trading' docs/115-implementation-authorization-s1a-candidate.md
          grep -Fq 'S1A remains read-only and network-free.' work-orders/HCT-IMP-0004-S1A.md
          grep -Fq 'No state-changing exchange command API exists.' work-orders/HCT-IMP-0004-S1A.md

      - name: Verify governance-only diff boundary
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$(git merge-base "$AUTHORIZED_BASE_SHA" "$head")" = "$AUTHORIZED_BASE_SHA"
          changed="$(git diff --name-only "$AUTHORIZED_BASE_SHA...$head")"
          printf '%s\n' "$changed"
          invalid="$(printf '%s\n' "$changed" | grep -Ev '^(docs/115-implementation-authorization-s1a-candidate\.md|work-orders/HCT-IMPL-AUTH-0004\.md|work-orders/HCT-IMP-0004-S1A\.md|\.github/workflows/implementation-authorization-s1a-governance\.yml)$' || true)"
          if [ -n "$invalid" ]; then
            echo 'S1A authorization PR contains changes outside governance-only boundary:'
            echo "$invalid"
            exit 1
          fi
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4
          git diff --check "$AUTHORIZED_BASE_SHA...$head"

      - name: Governance summary
        run: |
          echo 'S1A authorization candidate is governance-only and remains pre-authorization.'
          echo 'Bounded subject: provider-neutral exchange abstraction, capability snapshots and contract/reference semantics.'
          echo 'No concrete MEXC/network/auth/signing/market-ingest/order/deployment/live authority is granted.'
