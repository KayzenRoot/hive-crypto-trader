name: HCT-IMP-0002-S0B Implementation Governance

on:
  pull_request:
    branches: [main]
    paths:
      - "adr/HCT-ADR-0043-s0b-security-context-secret-boundary.md"
      - "apps/backend/**"
      - "scripts/**"
      - "evidence/HCT-IMP-0002-S0B.md"
      - ".github/workflows/implementation-s0b-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AUTHORIZED_BASE_SHA: aef99bcb9ed3c4af3b27bd97e9629caf4dbf6faf

jobs:
  s0b-quality:
    name: s0b-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact raw pull request head and authorized base
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.sha }}" = "$AUTHORIZED_BASE_SHA"

      - name: Validate canonical authorization checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$AUTHORIZED_BASE_SHA^{commit}"
          test "$(git rev-parse "$AUTHORIZED_BASE_SHA")" = "$AUTHORIZED_BASE_SHA"
          grep -Fq '"checkpoint_id": "HCT-CP-0017"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"status": "IMPLEMENTATION_AUTHORIZED_S0B"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"implementation_authorized": true' checkpoints/workstreams/planning/latest.json
          grep -Fq '"implementation_authorization_scope": [' checkpoints/workstreams/planning/latest.json
          grep -Fq '"HCT-IMP-0002-S0B"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"implementation_authorization_ceiling": "NON_TRADING_STAGE_0_SECURITY_FOUNDATION_ONLY"' checkpoints/workstreams/planning/latest.json
          grep -Fq '"production_credentials_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"production_deployment_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"limited_live_authorized": false' checkpoints/workstreams/planning/latest.json
          grep -Fq '"live_trading_authorized": false' checkpoints/workstreams/planning/latest.json

      - name: Validate candidate changed-file boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          changed="$(git diff --name-only "$AUTHORIZED_BASE_SHA...HEAD")"
          printf '%s\n' "$changed"
          invalid="$(printf '%s\n' "$changed" | grep -Ev '^(adr/HCT-ADR-0043-s0b-security-context-secret-boundary\.md|apps/backend/|scripts/|evidence/HCT-IMP-0002-S0B\.md|\.github/workflows/implementation-s0b-governance\.yml)' || true)"
          if [ -n "$invalid" ]; then
            echo 'S0B changed files leave the authorized implementation boundary:'
            echo "$invalid"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(checkpoints/|docs/|work-orders/|apps/frontend/|packages/contracts/)'; then
            echo 'Frozen/public surfaces changed by S0B'
            exit 1
          fi
          git diff --check "$AUTHORIZED_BASE_SHA...HEAD"

      - name: Install locked backend dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.13
          uv sync --project apps/backend --locked --all-groups

      - name: Run backend and S0A regression gates
        run: |
          python scripts/generate_contracts.py --check
          uv run --project apps/backend python scripts/validate_contract_parity.py
          cd apps/backend
          uv run pytest --cov=hct_backend --cov-report=term-missing
          uv run ruff check src tests
          uv run mypy src
          cd ../..
          uv build --project apps/backend --out-dir /tmp/hct-backend-dist
          uv run --project apps/backend --with pip-audit==2.10.1 pip-audit --local
          uv run --project apps/backend python scripts/validate_s0a.py

      - name: Run S0B secret and capability boundary scan
        env:
          BASE_SHA: ${{ env.AUTHORIZED_BASE_SHA }}
        run: python scripts/scan_s0b_boundaries.py

      - name: Install and validate frontend regression surface
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Run frontend regression gates
        working-directory: apps/frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run lint
          npm run format:check
          npm run build
          npm audit --audit-level=high --omit=optional

      - name: Publish governance summary
        run: |
          echo 'S0B implementation gates passed on the exact raw head.'
          echo 'No production credentials, external secret provider, exchange, persistence, deployment, limited-live or live-trading capability is authorized.'
